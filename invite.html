<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приглашение</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Marck+Script&family=Montserrat:wght@300;400;500;600;700;800&family=Forum&family=Oswald:wght@400;500;600&family=Prata&family=Caveat:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0c;
      --card-bg: rgba(255,255,255,.03);
      --card-border: rgba(212,175,55,.35);
      --text: #f3ead7;
      --muted: rgba(243,234,215,.65);
      --accent: #d4af37;
      --btn-bg: transparent;
      --btn-color: #d4af37;
      --btn-border: 1px solid #d4af37;
      --btn-radius: 2px;
      --radius: 6px;
      --font-head: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'Montserrat', Arial, sans-serif;
      --input-bg: rgba(255,255,255,.06);
      --input-border: rgba(255,255,255,.16);
      --input-text: #f3ead7;
      --input-radius: 2px;
      --photo-radius: 4px;
      --photo-border: 1px solid rgba(212,175,55,.45);
    }

    /* ===== ШАБЛОН 01 · LUXURY · свадьба ===== */
    body.tpl-01 {
      --bg-image: radial-gradient(1100px 520px at 50% -12%, rgba(212,175,55,.14), transparent 62%);
    }
    body.tpl-01::before,
    body.tpl-01::after {
      content: '';
      position: fixed; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      pointer-events: none; z-index: 0;
    }
    body.tpl-01::before { top: 0; }
    body.tpl-01::after { bottom: 0; }
    body.tpl-01 .card { box-shadow: inset 0 0 0 1px rgba(212,175,55,.12); }

    /* ===== ШАБЛОН 02 · FLORAL · свадьба ===== */
    body.tpl-02 {
      --bg: #fdf6f0;
      --card-bg: #ffffff;
      --card-border: #f2dfe0;
      --text: #4b3a3f;
      --muted: #8a7076;
      --accent: #c9648a;
      --btn-bg: #c9648a;
      --btn-color: #ffffff;
      --btn-border: 1px solid #c9648a;
      --btn-radius: 999px;
      --radius: 28px;
      --font-head: 'Marck Script', cursive;
      --input-bg: #ffffff;
      --input-border: #ead7d9;
      --input-text: #4b3a3f;
      --input-radius: 14px;
      --photo-radius: 24px;
      --photo-border: 1px solid #f2dfe0;
      --bg-image:
        radial-gradient(620px 420px at 8% -6%, rgba(201,100,138,.14), transparent 60%),
        radial-gradient(620px 420px at 96% 104%, rgba(150,190,150,.20), transparent 60%);
    }
    body.tpl-02::before,
    body.tpl-02::after {
      position: fixed; pointer-events: none; z-index: 0; line-height: 1;
    }
    body.tpl-02::before {
      content: '✿'; top: -34px; left: -22px; font-size: 210px;
      color: rgba(201,100,138,.10); transform: rotate(-12deg);
    }
    body.tpl-02::after {
      content: '❀'; bottom: -34px; right: -14px; font-size: 210px;
      color: rgba(150,190,150,.16); transform: rotate(14deg);
    }
    body.tpl-02 .names { font-size: 58px; font-weight: 400; }
    body.tpl-02 .signature { font-family: 'Marck Script', cursive; font-size: 26px; font-weight: 400; }
    body.tpl-02 .section, body.tpl-02 .card { box-shadow: 0 10px 30px rgba(90,60,60,.08); }

    /* ===== ШАБЛОН 03 · QAZAQ · той ===== */
    body.tpl-03 {
      --bg: #0b3550;
      --card-bg: rgba(255,255,255,.05);
      --card-border: rgba(244,197,66,.45);
      --text: #f5efdf;
      --muted: rgba(245,239,223,.72);
      --accent: #f4c542;
      --btn-bg: #f4c542;
      --btn-color: #0b3550;
      --btn-border: 1px solid #f4c542;
      --btn-radius: 10px;
      --radius: 16px;
      --font-head: 'Forum', serif;
      --input-bg: rgba(255,255,255,.08);
      --input-border: rgba(244,197,66,.35);
      --input-text: #f5efdf;
      --input-radius: 10px;
      --photo-radius: 12px;
      --photo-border: 1px solid rgba(244,197,66,.5);
      --bg-image: radial-gradient(900px 460px at 50% -10%, rgba(244,197,66,.12), transparent 60%);
      padding-top: 46px;
      padding-bottom: 46px;
    }
    body.tpl-03::before,
    body.tpl-03::after {
      content: '';
      position: fixed; left: 0; right: 0; height: 24px;
      background: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='44'%20height='24'%20viewBox='0%200%2044%2024'%3E%3Cpath%20d='M2%2020%20C8%204%2016%204%2022%2012%20C28%204%2036%204%2042%2020'%20fill='none'%20stroke='%23f4c542'%20stroke-width='2'/%3E%3Ccircle%20cx='22'%20cy='14'%20r='2.2'%20fill='%23f4c542'/%3E%3C/svg%3E") repeat-x center / 44px 24px;
      pointer-events: none; z-index: 0;
    }
    body.tpl-03::before { top: 0; }
    body.tpl-03::after { bottom: 0; }
    body.tpl-03 .names { letter-spacing: .05em; }

    /* ===== ШАБЛОН 04 · EDITORIAL · юбилей ===== */
    body.tpl-04 {
      --bg: #f2f0eb;
      --card-bg: transparent;
      --card-border: #141414;
      --text: #141414;
      --muted: #5c5c5c;
      --accent: #141414;
      --btn-bg: #141414;
      --btn-color: #ffffff;
      --btn-border: 1px solid #141414;
      --btn-radius: 0;
      --radius: 0;
      --font-head: 'Oswald', sans-serif;
      --input-bg: #ffffff;
      --input-border: #141414;
      --input-text: #141414;
      --input-radius: 0;
      --photo-radius: 0;
      --photo-border: 1px solid #141414;
      --bg-image: linear-gradient(90deg, rgba(20,20,20,.06) 1px, transparent 1px);
      --bg-size: 96px 100%;
      padding-top: 40px;
    }
    body.tpl-04::before,
    body.tpl-04::after {
      content: '';
      position: fixed; left: 0; right: 0; height: 8px;
      background: #141414;
      pointer-events: none; z-index: 0;
    }
    body.tpl-04::before { top: 0; }
    body.tpl-04::after { bottom: 0; }
    body.tpl-04 .card {
      background: transparent; border: none; border-radius: 0;
      border-top: 6px solid #141414; border-bottom: 1px solid #141414;
      text-align: left; padding: 34px 0;
    }
    body.tpl-04 .section {
      background: transparent; border: none; border-radius: 0;
      border-top: 3px solid #141414; padding: 26px 0;
    }
    body.tpl-04 .names { font-size: 54px; text-transform: uppercase; letter-spacing: .02em; line-height: 1.05; font-weight: 600; }
    body.tpl-04 .big-number { font-size: 96px; font-weight: 600; }
    body.tpl-04 .date-line { text-transform: uppercase; letter-spacing: .14em; font-size: 15px; font-family: 'Oswald', sans-serif; }
    body.tpl-04 .section h2 {
      font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: .16em;
      font-size: 15px; color: #141414; border-bottom: 2px solid #141414;
      display: inline-block; padding-bottom: 6px;
    }
    body.tpl-04 .program-time { font-family: 'Oswald', sans-serif; font-size: 20px; letter-spacing: .08em; }
    body.tpl-04 .photo { filter: grayscale(15%); }
    body.tpl-04 .center { text-align: left; }
    body.tpl-04 .actions { justify-content: flex-start; }

    /* ===== ШАБЛОН 05 · EMERALD · день рождения ===== */
    body.tpl-05 {
      --bg: #07271b;
      --card-bg: rgba(255,255,255,.04);
      --card-border: rgba(217,180,91,.55);
      --text: #eae4d3;
      --muted: rgba(234,228,211,.72);
      --accent: #d9b45b;
      --btn-bg: #d9b45b;
      --btn-color: #07271b;
      --btn-border: 1px solid #d9b45b;
      --btn-radius: 0;
      --radius: 0;
      --font-head: 'Prata', serif;
      --input-bg: rgba(255,255,255,.07);
      --input-border: rgba(217,180,91,.4);
      --input-text: #eae4d3;
      --input-radius: 0;
      --photo-radius: 0;
      --photo-border: 1px solid rgba(217,180,91,.6);
      --bg-image: radial-gradient(900px 460px at 50% -10%, rgba(217,180,91,.12), transparent 60%);
      padding-top: 36px;
      padding-bottom: 36px;
    }
    body.tpl-05::before,
    body.tpl-05::after {
      content: '';
      position: fixed; left: 0; right: 0; height: 12px;
      background:
        repeating-linear-gradient(45deg, rgba(217,180,91,.5) 0 2px, transparent 2px 10px),
        repeating-linear-gradient(-45deg, rgba(217,180,91,.5) 0 2px, transparent 2px 10px);
      pointer-events: none; z-index: 0;
    }
    body.tpl-05::before { top: 0; }
    body.tpl-05::after { bottom: 0; }
    body.tpl-05 .card, body.tpl-05 .section {
      outline: 1px solid rgba(217,180,91,.35);
      outline-offset: 7px;
    }
    body.tpl-05 .names { letter-spacing: .04em; }

    /* ===== ШАБЛОН 06 · TUSAU · тұсау кесер ===== */
    body.tpl-06 {
      --bg: #fff6ec;
      --card-bg: #ffffff;
      --card-border: #ffd9b8;
      --text: #4a3f38;
      --muted: #8b7d72;
      --accent: #2fb8a6;
      --btn-bg: #2fb8a6;
      --btn-color: #ffffff;
      --btn-border: 1px solid #2fb8a6;
      --btn-radius: 999px;
      --radius: 26px;
      --font-head: 'Caveat', cursive;
      --font-body: 'Nunito', Arial, sans-serif;
      --input-bg: #ffffff;
      --input-border: #ffe1c9;
      --input-text: #4a3f38;
      --input-radius: 16px;
      --photo-radius: 22px;
      --photo-border: 2px dashed #ffcf9f;
      --bg-image:
        radial-gradient(#ffd9b8 2.2px, transparent 2.7px),
        radial-gradient(#bfe8e0 2.2px, transparent 2.7px);
      --bg-size: 52px 52px, 64px 64px;
      --bg-pos: 0 0, 26px 32px;
    }
    body.tpl-06::before,
    body.tpl-06::after {
      position: fixed; pointer-events: none; z-index: 0; line-height: 1; opacity: .16; font-size: 110px;
    }
    body.tpl-06::before { content: '🎈'; top: 10px; left: 8px; transform: rotate(-10deg); }
    body.tpl-06::after { content: '🎈'; bottom: 10px; right: 8px; transform: rotate(10deg); }
    body.tpl-06 .names { font-size: 56px; font-weight: 700; }
    body.tpl-06 .signature { font-family: 'Caveat', cursive; font-size: 26px; }
    body.tpl-06 .section h2 { font-family: 'Nunito', sans-serif; font-weight: 800; }
    body.tpl-06 .big-number {
      font-family: 'Nunito', sans-serif;
      display: inline-flex; align-items: center; justify-content: center;
      width: 104px; height: 104px; border-radius: 50%;
      background: var(--accent); color: #fff; font-size: 44px; font-weight: 800;
    }
    body.tpl-06 .card { border: 2px dashed #ffcf9f; }
    body.tpl-06 .section, body.tpl-06 .card { box-shadow: 0 10px 26px rgba(120,90,60,.10); }

    /* ===== БАЗА ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      background-image: var(--bg-image, none);
      background-size: var(--bg-size, auto);
      background-position: var(--bg-pos, center);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px;
      min-height: 100vh;
      transition: background-color .3s ease;
    }

    .invite {
      max-width: 820px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 38px 26px;
      text-align: center;
    }

    .photo {
      width: 100%;
      max-height: 430px;
      object-fit: cover;
      border-radius: var(--photo-radius);
      border: var(--photo-border);
      margin-bottom: 24px;
    }

    .big-number {
      font-family: var(--font-head);
      font-size: 76px;
      line-height: 1;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .names {
      font-family: var(--font-head);
      font-size: 44px;
      line-height: 1.15;
      font-weight: 700;
      margin-bottom: 12px;
      overflow-wrap: break-word;
    }

    .date-line {
      font-size: 21px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .hashtag {
      color: var(--muted);
      font-size: 16px;
      overflow-wrap: break-word;
    }

    .section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 26px;
      margin-top: 22px;
    }

    .section h2 {
      font-family: var(--font-head);
      font-size: 20px;
      color: var(--accent);
      margin-bottom: 14px;
      letter-spacing: .03em;
    }

    .venue-name { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .venue-address { color: var(--muted); overflow-wrap: break-word; }

    .text-block { margin-bottom: 22px; white-space: pre-line; overflow-wrap: break-word; }
    .text-block:last-child { margin-bottom: 0; }

    .signature { margin-top: 12px; color: var(--accent); font-weight: 600; }

    .lang-label {
      display: inline-block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      padding: 4px 10px;
      margin-bottom: 10px;
    }

    .program-item { padding: 16px 0; border-bottom: 1px dashed var(--card-border); }
    .program-item:last-child { border-bottom: none; padding-bottom: 0; }
    .program-time { color: var(--accent); font-weight: 800; margin-bottom: 6px; }
    .program-title { font-weight: 700; margin-bottom: 4px; }
    .program-desc { color: var(--muted); white-space: pre-line; overflow-wrap: break-word; }
    .program-lang { margin-top: 10px; }

    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 12px 20px;
      border-radius: var(--btn-radius);
      border: var(--btn-border);
      background: var(--btn-bg);
      color: var(--btn-color);
      font-weight: 700;
      font-family: var(--font-body);
      text-decoration: none;
      cursor: pointer;
      transition: opacity .2s ease, transform .2s ease;
    }
    .btn:hover { opacity: .88; transform: translateY(-1px); }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 14px; }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border-radius: var(--input-radius);
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--input-text);
      font: inherit;
    }
    .form-group textarea { min-height: 110px; resize: vertical; }

    .form-note { margin-top: 12px; font-size: 14px; color: var(--muted); }
    .success { color: #4cd48a; font-weight: 700; }
    .error { color: #ff9d9d; font-weight: 700; }

    .center { text-align: center; }

    .message-screen {
      min-height: 80vh;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
      position: relative; z-index: 1;
    }
    .message-box {
      max-width: 560px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 34px 24px;
    }
    .message-box h1 { font-family: var(--font-head); font-size: 34px; margin-bottom: 12px; }
    .message-box p { color: var(--muted); }

    @media (max-width: 640px) {
      .card { padding: 28px 16px; }
      .names { font-size: 32px; }
      body.tpl-02 .names { font-size: 42px; }
      body.tpl-04 .names { font-size: 38px; }
      body.tpl-06 .names { font-size: 42px; }
      .big-number { font-size: 60px; }
      .date-line { font-size: 18px; }
      .section { padding: 20px 16px; }
      .actions .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main id="app"></main>

  <script>
    const MONTHS_RU = [
      'января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
      'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'
    ];

    const SAMPLE = {
      template: '01',
      language: 'both',
      names: 'Айдана & Арман',
      bigNumber: '',
      date: '2026-12-25',
      startTime: '18:00',
      endTime: '23:30',
      venueName: 'Ресторан «Астана»',
      address: 'г. Астана, ул. Пример, 1',
      mapUrl: '',
      textRu: 'Дорогие {names}! Приглашаем вас разделить с нами один из самых важных и тёплых дней в нашей жизни.',
      signatureRu: 'С любовью, {names}',
      textKz: 'Құрметті {names}! Сізді өміріміздегі ең маңызды әрі жылы күндердің біріне шақырамыз.',
      signatureKz: 'Ілтипатпен, {names}',
      hashtag: '#АйданаАрман2026',
      program: [
        { time: '18:00', titleRu: 'Сбор гостей', descRu: 'Приветственный фуршет', titleKz: 'Қонақтарды қарсы алу', descKz: 'Қош келдіңіз фуршеті' },
        { time: '19:00', titleRu: 'Начало программы', descRu: 'Торжественная часть', titleKz: 'Бағдарламаның басталуы', descKz: 'Салтанатты бөлім' }
      ],
      photoUrl: '',
      web3formsKey: ''
    };

    window.addEventListener('DOMContentLoaded', () => {
      let invite = null;

      if (location.hash === '#demo') {
        invite = SAMPLE;
      } else if (location.hash.startsWith('#demo-')) {
        const tpl = location.hash.slice(6);
        invite = Object.assign({}, SAMPLE, { template: tpl });
      } else if (location.hash.startsWith('#d=')) {
        invite = decodePayload(location.hash.slice(3));
      }

      if (!invite) {
        showMessage(
          'Приглашение',
          'Эта страница откроет электронное приглашение по ссылке, которую создаст администратор.'
        );
        return;
      }

      renderInvite(invite);
    });

    function decodePayload(str) {
      try {
        str = String(str || '').replace(/-/g, '+').replace(/_/g, '/');
        while (str.length % 4 !== 0) str += '=';
        const percentString = atob(str);
        return JSON.parse(decodeURIComponent(percentString));
      } catch (e) {
        console.error('Ошибка чтения приглашения', e);
        return null;
      }
    }

    function showMessage(title, text) {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="message-screen">
          <div class="message-box">
            <h1 id="message-title"></h1>
            <p id="message-text"></p>
          </div>
        </div>
      `;
      document.getElementById('message-title').textContent = title || 'Приглашение';
      document.getElementById('message-text').textContent = text || '';
    }

    function renderInvite(invite) {
      const app = document.getElementById('app');
      const templateId = String(invite.template || '01');

      document.body.className = 'tpl-' + templateId;
      document.title = `${invite.names || 'Приглашение'} — Приглашение`;

      app.innerHTML = `
        <div class="invite">
          <div class="card">
            <img id="invite-photo" class="photo" alt="Фото приглашения" hidden referrerpolicy="no-referrer">
            <div id="invite-big-number" class="big-number"></div>
            <h1 id="invite-names" class="names"></h1>
            <div id="invite-date" class="date-line"></div>
            <div id="invite-hashtag" class="hashtag"></div>
          </div>

          <div id="venue-section" class="section" hidden>
            <h2>Место проведения</h2>
            <div id="venue-name" class="venue-name"></div>
            <div id="venue-address" class="venue-address"></div>
            <div class="actions">
              <a id="map-button" class="btn" target="_blank" rel="noopener noreferrer">Как добраться</a>
            </div>
          </div>

          <div id="text-section" class="section" hidden>
            <h2>Приглашение</h2>
            <div id="text-ru-block" class="text-block" hidden>
              <div id="text-ru-label" class="lang-label">Русский</div>
              <div id="text-ru"></div>
              <div id="signature-ru" class="signature"></div>
            </div>
            <div id="text-kz-block" class="text-block" hidden>
              <div id="text-kz-label" class="lang-label">Қазақша</div>
              <div id="text-kz"></div>
              <div id="signature-kz" class="signature"></div>
            </div>
          </div>

          <div id="program-section" class="section" hidden>
            <h2>Программа дня</h2>
            <div id="program-list"></div>
          </div>

          <div id="rsvp-section" class="section" hidden>
            <h2>Ответить на приглашение</h2>
            <form id="rsvp-form">
              <div class="form-group">
                <label for="rsvp-name">Имя и фамилия</label>
                <input type="text" id="rsvp-name" name="name" required>
              </div>
              <div class="form-group">
                <label for="rsvp-attendance">Придёте ли вы?</label>
                <select id="rsvp-attendance" name="attendance" required>
                  <option value="">Выберите ответ</option>
                  <option value="Приду">Приду</option>
                  <option value="Приду с парой / семьёй">Приду с парой / семьёй</option>
                  <option value="Не смогу">Не смогу</option>
                </select>
              </div>
              <div class="form-group">
                <label for="rsvp-guests">Количество гостей</label>
                <input type="number" id="rsvp-guests" name="guests" min="1" max="20" value="1">
              </div>
              <div class="form-group">
                <label for="rsvp-comment">Комментарий</label>
                <textarea id="rsvp-comment" name="comment" placeholder="Например: будем немного позже"></textarea>
              </div>
              <input type="text" name="botcheck" id="rsvp-botcheck" style="display:none !important" tabindex="-1" autocomplete="off">
              <button type="submit" class="btn" id="rsvp-submit">Отправить ответ</button>
              <div id="rsvp-status" class="form-note"></div>
            </form>
          </div>

          <div class="section center" id="calendar-section" hidden>
            <h2>Календарь</h2>
            <p style="color: var(--muted); margin-bottom: 14px;">Сохраните дату мероприятия, чтобы не забыть.</p>
            <button type="button" class="btn" id="ics-button">Добавить в календарь</button>
          </div>
        </div>
      `;

      renderCover(invite);
      renderVenue(invite);
      renderTexts(invite);
      renderProgram(invite);
      renderRSVP(invite);
      renderCalendar(invite);
    }

    function renderCover(invite) {
      const photo = document.getElementById('invite-photo');
      const bigNumber = document.getElementById('invite-big-number');
      const names = document.getElementById('invite-names');
      const dateLine = document.getElementById('invite-date');
      const hashtag = document.getElementById('invite-hashtag');

      if (invite.photoUrl && isValidHttpUrl(invite.photoUrl)) {
        photo.src = invite.photoUrl;
        photo.hidden = false;
        photo.addEventListener('error', () => { photo.hidden = true; });
      }

      setText(bigNumber, invite.bigNumber || '');
      setText(names, invite.names || 'Приглашение');

      const dateText = formatHumanDate(invite.date);
      const timeText = formatTimeLine(invite.startTime, invite.endTime);
      dateLine.textContent = [dateText, timeText].filter(Boolean).join(' · ');

      setText(hashtag, invite.hashtag || '');
    }

    function renderVenue(invite) {
      const section = document.getElementById('venue-section');
      const venueName = document.getElementById('venue-name');
      const venueAddress = document.getElementById('venue-address');
      const mapButton = document.getElementById('map-button');

      const hasVenue = invite.venueName || invite.address || invite.mapUrl;
      if (!hasVenue) { section.hidden = true; return; }

      section.hidden = false;
      setText(venueName, invite.venueName || '');
      setText(venueAddress, invite.address || '');

      let mapHref = '';
      if (invite.mapUrl && isValidHttpUrl(invite.mapUrl)) {
        mapHref = invite.mapUrl;
      } else {
        const query = [invite.venueName, invite.address].filter(Boolean).join(', ');
        if (query) mapHref = 'https://2gis.kz/search/' + encodeURIComponent(query);
      }

      if (mapHref) {
        mapButton.href = mapHref;
        mapButton.hidden = false;
      } else {
        mapButton.hidden = true;
      }
    }

    function renderTexts(invite) {
      const section = document.getElementById('text-section');
      const showRu = invite.language === 'ru' || invite.language === 'both';
      const showKz = invite.language === 'kz' || invite.language === 'both';

      const ruText = replaceNames(invite.textRu, invite.names);
      const ruSignature = replaceNames(invite.signatureRu, invite.names);
      const kzText = replaceNames(invite.textKz, invite.names);
      const kzSignature = replaceNames(invite.signatureKz, invite.names);

      const hasRu = showRu && (ruText || ruSignature);
      const hasKz = showKz && (kzText || kzSignature);

      if (!hasRu && !hasKz) { section.hidden = true; return; }
      section.hidden = false;

      const ruBlock = document.getElementById('text-ru-block');
      const kzBlock = document.getElementById('text-kz-block');

      if (hasRu) {
        ruBlock.hidden = false;
        document.getElementById('text-ru-label').hidden = invite.language !== 'both';
        setText(document.getElementById('text-ru'), ruText);
        setText(document.getElementById('signature-ru'), ruSignature);
      } else {
        ruBlock.hidden = true;
      }

      if (hasKz) {
        kzBlock.hidden = false;
        document.getElementById('text-kz-label').hidden = invite.language !== 'both';
        setText(document.getElementById('text-kz'), kzText);
        setText(document.getElementById('signature-kz'), kzSignature);
      } else {
        kzBlock.hidden = true;
      }
    }

    function renderProgram(invite) {
      const section = document.getElementById('program-section');
      const list = document.getElementById('program-list');
      const program = Array.isArray(invite.program) ? invite.program : [];

      if (!program.length) { section.hidden = true; return; }

      section.hidden = false;
      list.innerHTML = '';

      const showRu = invite.language === 'ru' || invite.language === 'both';
      const showKz = invite.language === 'kz' || invite.language === 'both';

      program.forEach(item => {
        const hasRu = showRu && (item.titleRu || item.descRu);
        const hasKz = showKz && (item.titleKz || item.descKz);
        if (!hasRu && !hasKz && !item.time) return;

        const itemEl = document.createElement('div');
        itemEl.className = 'program-item';

        if (item.time) {
          const timeEl = document.createElement('div');
          timeEl.className = 'program-time';
          timeEl.textContent = item.time;
          itemEl.appendChild(timeEl);
        }

        if (hasRu) {
          itemEl.appendChild(createProgramLangBlock(invite.language === 'both' ? 'Русский' : '', item.titleRu, item.descRu));
        }
        if (hasKz) {
          itemEl.appendChild(createProgramLangBlock(invite.language === 'both' ? 'Қазақша' : '', item.titleKz, item.descKz));
        }

        list.appendChild(itemEl);
      });

      if (!list.children.length) section.hidden = true;
    }

    function createProgramLangBlock(labelText, title, desc) {
      const block = document.createElement('div');
      block.className = 'program-lang';

      if (labelText) {
        const label = document.createElement('div');
        label.className = 'lang-label';
        label.textContent = labelText;
        block.appendChild(label);
      }
      if (title) {
        const titleEl = document.createElement('div');
        titleEl.className = 'program-title';
        titleEl.textContent = title;
        block.appendChild(titleEl);
      }
      if (desc) {
        const descEl = document.createElement('div');
        descEl.className = 'program-desc';
        descEl.textContent = desc;
        block.appendChild(descEl);
      }
      return block;
    }

    function renderRSVP(invite) {
      const section = document.getElementById('rsvp-section');
      if (!invite.web3formsKey) { section.hidden = true; return; }

      section.hidden = false;
      const form = document.getElementById('rsvp-form');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const botcheck = document.getElementById('rsvp-botcheck').value;
        if (botcheck) {
          showRSVPStatus('Ответ отправлен. Спасибо!', true);
          form.reset();
          return;
        }

        const submitButton = document.getElementById('rsvp-submit');
        submitButton.disabled = true;
        submitButton.textContent = 'Отправка...';
        showRSVPStatus('Отправляем ответ...', false);

        const formData = new FormData(form);
        formData.append('access_key', invite.web3formsKey);
        formData.append('subject', `Ответ на приглашение: ${invite.names || 'Без имени'}`);
        formData.append('from_name', 'SAQTAA Invite');
        formData.append('Приглашение', invite.names || '');
        formData.append('Дата', formatHumanDate(invite.date));
        formData.append('Ссылка', location.href);

        try {
          const response = await fetch('https://api.web3forms.com/submit', { method: 'POST', body: formData });
          const result = await response.json();

          if (result.success) {
            form.reset();
            showRSVPStatus('Ответ отправлен. Спасибо!', true);
          } else {
            showRSVPStatus('Не удалось отправить ответ. Попробуйте позже.', false);
          }
        } catch (error) {
          console.error(error);
          showRSVPStatus('Ошибка отправки. Проверьте интернет и попробуйте снова.', false);
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = 'Отправить ответ';
        }
      });
    }

    function showRSVPStatus(text, isSuccess) {
      const status = document.getElementById('rsvp-status');
      status.textContent = text;
      status.className = 'form-note ' + (isSuccess ? 'success' : 'error');
    }

    function renderCalendar(invite) {
      const section = document.getElementById('calendar-section');
      const button = document.getElementById('ics-button');

      if (!invite.date || !invite.startTime) { section.hidden = true; return; }

      section.hidden = false;
      button.addEventListener('click', () => downloadICS(invite));
    }

    function downloadICS(invite) {
      const startMs = getEventUTC(invite.date, invite.startTime, 0);
      const endAddDays = invite.endTime && invite.endTime <= invite.startTime ? 1 : 0;
      const endMs = invite.endTime
        ? getEventUTC(invite.date, invite.endTime, endAddDays)
        : startMs + 2 * 60 * 60 * 1000;

      const description = [
        replaceNames(invite.textRu, invite.names),
        replaceNames(invite.textKz, invite.names)
      ].filter(Boolean).join('\n\n');

      const locationText = [invite.venueName, invite.address].filter(Boolean).join(', ');

      const lines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//SAQTAA//Invite//RU',
        'BEGIN:VEVENT',
        `UID:${Date.now()}@saqtaa-invite`,
        `DTSTAMP:${formatICSDate(Date.now())}`,
        `DTSTART:${formatICSDate(startMs)}`,
        `DTEND:${formatICSDate(endMs)}`,
        `SUMMARY:${escapeICS(invite.names || 'Приглашение')}`,
        `LOCATION:${escapeICS(locationText)}`,
        `DESCRIPTION:${escapeICS(description)}`,
        'END:VEVENT',
        'END:VCALENDAR'
      ];

      const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = 'invitation.ics';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function getEventUTC(dateStr, timeStr, addDays) {
      if (!dateStr || !timeStr) return Date.now();
      const [year, month, day] = dateStr.split('-').map(Number);
      const [hour, minute] = timeStr.split(':').map(Number);
      return Date.UTC(year, month - 1, day + addDays, hour, minute, 0) - 5 * 60 * 60 * 1000;
    }

    function formatICSDate(ms) {
      return new Date(ms).toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    }

    function escapeICS(text) {
      return String(text || '')
        .replace(/\\/g, '\\\\')
        .replace(/;/g, '\\;')
        .replace(/,/g, '\\,')
        .replace(/\n/g, '\\n')
        .trim();
    }

    function setText(element, value) {
      if (!element) return;
      element.textContent = value || '';
      element.hidden = !value;
    }

    function replaceNames(text, names) {
      return String(text || '').replaceAll('{names}', names || '');
    }

    function formatHumanDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const year = Number(parts[0]);
      const month = Number(parts[1]);
      const day = Number(parts[2]);
      if (!year || !month || !day || month < 1 || month > 12) return dateStr;
      return `${day} ${MONTHS_RU[month - 1]} ${year}`;
    }

    function formatTimeLine(startTime, endTime) {
      if (!startTime) return '';
      if (!endTime) return startTime;
      if (endTime <= startTime) return `${startTime} — ${endTime} (+1 день)`;
      return `${startTime} — ${endTime}`;
    }

    function isValidHttpUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === 'https:' || url.protocol === 'http:';
      } catch {
        return false;
      }
    }
  </script>
</body>
