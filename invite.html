<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F4A38">
<title>Приглашение</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Вас приглашают на праздник ✦">
<meta property="og:description" content="Откройте приглашение: программа, место проведения и ответ для хозяев.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--fd:"Playfair Display","PT Serif",Georgia,serif;--fb:"Manrope",system-ui,sans-serif;--hair:rgba(24,39,32,.15)}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:var(--fb);-webkit-font-smoothing:antialiased;line-height:1.55;background:#0B1511}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;background:none;border:0;color:inherit}
ul{list-style:none}
:focus-visible{outline:2px solid var(--acc,#B98E45);outline-offset:3px;border-radius:4px}
h1,h2,h3{font-family:var(--fd);font-weight:700;line-height:1.08}

/* ---- страница ---- */
.inv-page{position:relative;overflow-x:hidden;overflow-x:clip;min-height:100vh;min-height:100dvh;display:flex;justify-content:center;padding:clamp(28px,7vw,56px) clamp(18px,5vw,24px)}
.inv-inner{position:relative;z-index:1;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(20px,4.8vw,28px);padding:14px 0 28px}
.inv-kicker{font-size:.66rem;letter-spacing:.34em;text-transform:uppercase;opacity:.88}
.inv-names{font-size:clamp(2.35rem,9vw,3.45rem);line-height:1.05;overflow-wrap:break-word;max-width:100%;text-wrap:balance}
.inv-sub{font-size:.78rem;letter-spacing:.24em;text-transform:uppercase;opacity:.78}
.inv-lead-box{width:100%;max-width:440px;border:1px solid color-mix(in srgb,var(--acc) 32%,transparent);border-radius:16px;padding:clamp(16px,4.5vw,22px);background:color-mix(in srgb,var(--acc) 6%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 12px 28px -20px rgba(0,0,0,.45)}
.inv-lead{max-width:44ch;margin:0 auto;font-size:.96rem;line-height:1.68;opacity:.94;white-space:pre-line;text-wrap:pretty}
.inv-date{font-weight:700;letter-spacing:.16em;font-size:.95rem;font-variant-numeric:lining-nums tabular-nums}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:348px}
.cd>div{border:1px solid color-mix(in srgb,var(--acc) 36%,transparent);background:color-mix(in srgb,var(--acc) 8%,transparent);border-radius:13px;padding:11px 2px 9px;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 16px -12px rgba(0,0,0,.55)}
.cd b{display:block;font-family:var(--fd);font-size:clamp(1.3rem,5.2vw,1.6rem);font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.cd span{display:block;margin-top:3px;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.iv-sec{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;align-items:center}
.iv-eyebrow{font-size:.66rem;letter-spacing:.32em;text-transform:uppercase;color:var(--acc);display:inline-flex;align-items:center;gap:.9em;font-weight:700}
.iv-eyebrow::before,.iv-eyebrow::after{content:"";width:24px;height:1px;background:linear-gradient(90deg,transparent,currentColor)}
.iv-eyebrow::after{transform:scaleX(-1)}
.joy-h{font-family:var(--fd);font-size:clamp(1.7rem,7vw,2.35rem);font-weight:600;text-wrap:balance}
.orn-div{display:flex;align-items:center;gap:14px;width:min(340px,86%);opacity:.8}
.orn-div::before,.orn-div::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,currentColor);opacity:.6}
.orn-div::after{background:linear-gradient(270deg,transparent,currentColor)}
.orn-div span{font-size:.95rem;color:var(--acc);display:inline-block;animation:ornBreath 4.2s ease-in-out infinite}
@keyframes ornBreath{0%,100%{transform:scale(1);opacity:.82}50%{transform:scale(1.14);opacity:1}}

/* медальон-монограмма (когда без фото) */
.inv-mono{position:relative;width:88px;height:88px;display:grid;place-items:center;margin:2px 0 -4px}
.mono-ring{position:absolute;inset:-8px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--acc) 45%,transparent);pointer-events:none;animation:monoSpin 38s linear infinite}
@keyframes monoSpin{to{transform:rotate(360deg)}}
.mono-disc{width:88px;height:88px;border-radius:50%;border:2px solid var(--acc);background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--acc) 26%,transparent),color-mix(in srgb,var(--acc) 6%,rgba(0,0,0,.18)));box-shadow:0 10px 24px -10px rgba(0,0,0,.55),inset 0 2px 5px rgba(255,255,255,.32),inset 0 -4px 8px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;animation:monoFloat 5.4s ease-in-out infinite}
@keyframes monoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.mono-cr{font-style:normal;font-size:.7rem;line-height:1;color:var(--acc);opacity:.95}
.mono-txt{font-family:var(--fd);font-size:1.28rem;font-weight:700;line-height:1;letter-spacing:.04em;white-space:nowrap}
.mono-txt small{font-style:italic;font-weight:500;font-size:.82em;color:var(--acc)}
.mono-bt{font-style:normal;font-size:.62rem;line-height:1;color:var(--acc);opacity:.8}
.mono-sp{position:absolute;font-size:.75rem;color:var(--acc);text-shadow:0 0 8px color-mix(in srgb,var(--acc) 55%,transparent);pointer-events:none;animation:twinkle 3.4s ease-in-out infinite}
.mono-sp.ms1{top:-4px;right:-4px}.mono-sp.ms2{bottom:-4px;left:-4px;animation-delay:1.7s}

/* карточка локации и 3D-кнопка */
.loc-card{width:100%;border:1px solid color-mix(in srgb,var(--acc) 36%,transparent);border-radius:18px;padding:clamp(18px,5vw,24px);background:color-mix(in srgb,var(--acc) 6%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 14px 30px -20px rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s cubic-bezier(.22,1,.36,1)}
.v-hall{font-family:var(--fd);font-weight:700;font-size:1.3rem;line-height:1.2}
.v-addr{opacity:.78;font-size:.88rem;margin-bottom:10px}
.loc-btns{display:flex;flex-direction:column;gap:10px;width:100%;align-items:center}
.inv-btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;min-height:50px;padding:.8em 1.6em;border-radius:14px;border:1px solid color-mix(in srgb,var(--acc) 70%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 18%,transparent),color-mix(in srgb,var(--acc) 6%,transparent));box-shadow:0 4px 0 color-mix(in srgb,var(--acc) 32%,rgba(0,0,0,.35)),inset 0 1px 0 rgba(255,255,255,.24);font-weight:700;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;transition:transform .22s cubic-bezier(.22,1,.36,1),box-shadow .22s cubic-bezier(.22,1,.36,1),background .28s ease,color .28s ease;max-width:340px;width:100%}
.inv-btn:hover{background:var(--acc);color:var(--acc-ink);transform:translateY(-1px)}
.inv-btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--acc) 32%,rgba(0,0,0,.35))}

/* дресс-код с жемчужинами оттенков */
.dress-card{width:100%;border:1px solid color-mix(in srgb,var(--acc) 32%,transparent);border-radius:18px;padding:clamp(16px,4.5vw,22px);background:color-mix(in srgb,var(--acc) 5%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 12px 26px -18px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;gap:10px}
.dress-h{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);font-weight:800}
.dress-sub{font-size:.82rem;opacity:.8;max-width:36ch;line-height:1.45}
.dress-dots{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:4px}
.dress-dot{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:56px}
.dress-pearl{width:34px;height:34px;border-radius:50%;border:2px solid color-mix(in srgb,var(--acc) 85%,#fff);box-shadow:0 5px 12px -4px rgba(0,0,0,.55),inset 0 2px 4px rgba(255,255,255,.65);transition:transform .32s cubic-bezier(.22,1.4,.36,1)}
.dress-dot:hover .dress-pearl{transform:scale(1.12) translateY(-2px)}
.dress-dot span:last-child{font-size:.66rem;font-weight:600;opacity:.86;letter-spacing:.02em}

.langsw{position:absolute;top:14px;right:14px;z-index:5;min-height:38px;padding:0 14px;border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);border-radius:999px;font-size:.72rem;font-weight:800;letter-spacing:.14em;background:color-mix(in srgb,var(--acc) 16%,rgba(0,0,0,.22));box-shadow:0 3px 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .18s cubic-bezier(.22,1,.36,1),box-shadow .18s cubic-bezier(.22,1,.36,1),background .25s}
.langsw:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}

/* фото */
.ph-hero{width:100%;display:flex;justify-content:center}
.ph-frame{position:relative;width:min(430px,100%);aspect-ratio:1/0.92;overflow:hidden;border-radius:999px 999px 26px 26px;display:grid;place-items:center;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 30%,transparent),color-mix(in srgb,var(--acc) 74%,transparent));box-shadow:0 24px 48px -28px rgba(0,0,0,.62)}
.ph-frame::before{content:"";position:absolute;inset:9px;border:1px solid rgba(255,255,255,.5);border-radius:inherit;z-index:1;pointer-events:none}
.theme-editorial .ph-frame{border-radius:0}
.ph-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.06);transition:transform 1.5s cubic-bezier(.22,1,.36,1)}
.fx.in .ph-frame img{transform:scale(1)}
.ph-frame:not(.has-img) img{display:none}
.ph-frame.has-img .ph-ph{display:none}
.ph-frame::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04) 42%,rgba(0,0,0,.4));pointer-events:none}
.ph-ph{font-size:2.6rem;color:#fff;opacity:.6;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.ph-overlay{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 18px;text-align:center}
.ph-names{font-family:var(--fd);font-style:italic;font-weight:600;font-size:clamp(1.7rem,7.4vw,2.6rem);color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.55);overflow-wrap:break-word;max-width:100%}
.ph-title{font-size:.95rem;color:#fff;letter-spacing:.05em;text-shadow:0 1px 10px rgba(0,0,0,.55)}

/* программа — ровная линия строго по центру колечек */
.prog{width:100%;max-width:360px;position:relative;display:flex;flex-direction:column;text-align:left}
.prog::before{content:"";position:absolute;left:66.5px;top:14px;bottom:14px;width:1px;border:0;background:linear-gradient(180deg,transparent,var(--acc) 14%,var(--acc) 86%,transparent);opacity:.58}
.prog li{display:grid;grid-template-columns:52px 18px 1fr;gap:6px;padding:10px 0;align-items:start}
.prog b{font-family:var(--fd);font-size:1.05rem;color:var(--acc);padding-top:1px;font-variant-numeric:tabular-nums}
.prog i{width:10px;height:10px;border-radius:50%;border:2px solid var(--acc);background:var(--acc-ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent),0 0 8px color-mix(in srgb,var(--acc) 35%,transparent);justify-self:center;margin-top:6px;position:relative;z-index:1;transition:transform .4s cubic-bezier(.22,1.4,.36,1)}
.prog strong{display:block;font-size:.92rem;font-weight:700}
.prog span{font-size:.78rem;opacity:.75}

/* RSVP */
.rs-h{font-family:var(--fd);font-size:clamp(1.6rem,6.4vw,2.15rem);font-weight:600;text-wrap:balance}
.rs-sub{font-size:.9rem;opacity:.8;max-width:40ch}
.rs-form{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:8px}
.rs-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:400px){.rs-grid{grid-template-columns:1fr}}
.rs-field{display:flex;flex-direction:column;gap:7px;text-align:left}
.rs-field span{font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700;opacity:.85}
.rs-field span::after{content:" *";color:var(--acc);opacity:1}
.rs-field input{min-height:52px;border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);border-radius:12px;background:var(--field,rgba(255,255,255,.12));color:inherit;padding:0 14px;font-family:inherit;font-size:1rem;width:100%;box-shadow:inset 0 2px 5px rgba(0,0,0,.18);transition:border-color .25s ease,box-shadow .25s ease,transform .2s ease}
.rs-field input::placeholder{color:currentColor;opacity:.45}
.rs-field input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 24%,transparent),inset 0 2px 5px rgba(0,0,0,.18);transform:translateY(-1px)}
.rs-field input.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.rs-opts{display:flex;flex-direction:column;gap:10px}
.rs-opt{display:flex;align-items:center;gap:14px;border:1px solid color-mix(in srgb,var(--acc) 36%,transparent);border-radius:13px;background:color-mix(in srgb,var(--acc) 4%,transparent);box-shadow:0 3px 0 color-mix(in srgb,var(--acc) 18%,rgba(0,0,0,.22)),inset 0 1px 0 rgba(255,255,255,.12);padding:14px 16px;cursor:pointer;text-align:left;font-size:.95rem;transition:border-color .25s ease,background .25s ease,transform .18s cubic-bezier(.22,1,.36,1),box-shadow .18s cubic-bezier(.22,1,.36,1);position:relative}
.rs-opt:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--acc) 18%,rgba(0,0,0,.22))}
.rs-hp{position:absolute!important;left:-9999px!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important}
.rs-opt input{position:absolute;opacity:0;pointer-events:none}
.rs-opt i{flex:0 0 24px;width:24px;height:24px;border-radius:50%;border:2px solid color-mix(in srgb,var(--acc) 55%,transparent);position:relative;transition:border-color .25s ease}
.rs-opt i::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--acc);transform:scale(0);transition:transform .28s cubic-bezier(.2,1.4,.4,1)}
.rs-opt.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,transparent);box-shadow:0 4px 0 color-mix(in srgb,var(--acc) 30%,rgba(0,0,0,.28)),0 8px 18px -12px color-mix(in srgb,var(--acc) 65%,transparent),inset 0 1px 0 rgba(255,255,255,.2)}
.rs-opt.sel i{border-color:var(--acc)}
.rs-opt.sel i::after{transform:scale(1)}
.rs-opt:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:3px}
.rs-send{position:relative;overflow:hidden;width:100%;min-height:56px;border-radius:14px;border:1px solid color-mix(in srgb,#fff 32%,var(--acc));background:linear-gradient(180deg,color-mix(in srgb,#fff 22%,var(--acc)) 0%,var(--acc) 55%,color-mix(in srgb,#000 18%,var(--acc)) 100%);color:var(--acc-ink);font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:.82rem;display:inline-flex;align-items:center;justify-content:center;gap:.55em;box-shadow:0 5px 0 color-mix(in srgb,#000 42%,var(--acc)),0 14px 26px -12px color-mix(in srgb,var(--acc) 75%,transparent),inset 0 1.5px 0 rgba(255,255,255,.55);transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s cubic-bezier(.22,1,.36,1),filter .25s ease,opacity .25s ease;margin-top:4px}
.rs-send::after{content:"";position:absolute;top:0;bottom:0;left:-120%;width:65%;background:linear-gradient(105deg,transparent 20%,rgba(255,255,255,.36) 50%,transparent 80%);transform:skewX(-20deg);animation:btnSheen 5.6s ease-in-out 1.4s infinite;pointer-events:none}
@keyframes btnSheen{0%,62%,100%{left:-120%}32%{left:160%}}
.rs-send:hover{filter:brightness(1.06);transform:translateY(-1px)}
.rs-send:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,#000 42%,var(--acc)),0 6px 14px -8px color-mix(in srgb,var(--acc) 70%,transparent)}
.rs-send[disabled]{opacity:.55;pointer-events:none}
.rs-note{font-size:.76rem;opacity:.68}
.rs-err{font-size:.84rem;font-weight:700;color:var(--acc)}
.rs-err:empty{display:none}
.rs-done{width:100%;display:flex;justify-content:center}
.rd-card{width:100%;max-width:420px;border-radius:18px;border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);outline:1px solid color-mix(in srgb,var(--acc) 28%,transparent);outline-offset:5px;background:color-mix(in srgb,var(--acc) 6%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 18px 36px -22px rgba(0,0,0,.55);padding:clamp(26px,6vw,40px) clamp(18px,5vw,30px);display:flex;flex-direction:column;align-items:center;gap:12px;animation:pop .55s cubic-bezier(.22,1.25,.36,1)}
@keyframes pop{from{transform:translateY(14px) scale(.88);opacity:0}to{transform:none;opacity:1}}
.rd-check{width:84px;height:84px;border:2px solid var(--acc);border-radius:50%;display:grid;place-items:center;color:var(--acc);margin-bottom:4px;box-shadow:inset 0 2px 6px rgba(255,255,255,.22),0 6px 16px -8px color-mix(in srgb,var(--acc) 55%,transparent)}
.rd-check svg{width:42px;height:42px}
.rd-check svg path{stroke-dasharray:48;stroke-dashoffset:48;animation:drawCheck .6s .15s cubic-bezier(.22,1,.36,1) forwards}
@keyframes drawCheck{to{stroke-dashoffset:0}}
.rd-title{font-family:var(--fd);font-style:italic;font-weight:600;font-size:clamp(2rem,8vw,2.7rem);color:var(--acc);line-height:1}
.rd-title:focus{outline:none}
.rd-name{font-weight:800;font-size:1.15rem;max-width:100%;overflow-wrap:break-word;word-break:break-word}
.rd-msg{font-size:.92rem;opacity:.85;max-width:34ch}
.rd-div{width:56px;height:1px;background:var(--acc);opacity:.6;margin:4px 0}
.rd-date{font-size:.78rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--acc)}
.rd-venue{font-size:.85rem;opacity:.75}
.rd-cals{align-self:stretch;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%}
.rd-gcal{display:inline-flex;align-items:center;min-height:40px;font-size:.8rem;text-decoration:underline;opacity:.75}
.rs-guests{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:13px;padding:12px 14px;background:color-mix(in srgb,var(--acc) 6%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.14);text-align:left;animation:guestIn .34s cubic-bezier(.22,1,.36,1)}
@keyframes guestIn{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
.rs-guests[hidden],.rd-guests[hidden]{display:none!important}
.rs-guests-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.rs-guests-lbl{font-size:.9rem;font-weight:700;line-height:1.25}
.rs-guests-hint{font-size:.74rem;opacity:.74;line-height:1.25}
.rs-step{display:inline-flex;align-items:center;gap:8px;flex-shrink:0}
.rs-step-btn{width:40px;height:40px;border-radius:50%;border:1px solid color-mix(in srgb,var(--acc) 65%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 22%,transparent),color-mix(in srgb,var(--acc) 6%,transparent));box-shadow:0 3px 0 color-mix(in srgb,var(--acc) 28%,rgba(0,0,0,.35)),inset 0 1px 0 rgba(255,255,255,.28);color:inherit;font-size:1.2rem;line-height:1;font-weight:700;display:grid;place-items:center;transition:transform .16s cubic-bezier(.22,1,.36,1),box-shadow .16s cubic-bezier(.22,1,.36,1),opacity .18s}
.rs-step-btn:not([disabled]):active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--acc) 28%,rgba(0,0,0,.35))}
.rs-step-btn[disabled]{opacity:.3;pointer-events:none}
.rs-step-val{min-width:24px;text-align:center;font-family:var(--fd);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc);display:inline-block}
.rs-step-val.pop{animation:numPop .28s cubic-bezier(.22,1.5,.36,1)}
@keyframes numPop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
.cd b.tick-pop{animation:cdTick .34s cubic-bezier(.22,1,.36,1)}
@keyframes cdTick{0%{transform:translateY(-3px) scale(1.07);opacity:.72}100%{transform:none;opacity:1}}
.rd-guests{font-size:.82rem;font-weight:700;color:var(--acc);margin-top:-4px}

/* плавное каскадное появление при прокрутке */
#app{transition:opacity .28s ease}
#app.lang-fade{opacity:.25}
.fx{opacity:0;transform:translateY(24px) scale(.985);transition:opacity .82s cubic-bezier(.22,1,.36,1),transform .82s cubic-bezier(.22,1,.36,1);transition-delay:var(--d,0s);will-change:opacity,transform}
.fx.in{opacity:1;transform:none}
.iv-sec.fx,.inv-sign.fx,.inv-hash.fx,.inv-wm.fx{transition-delay:.05s}
.cd.fx>div,.iv-sec.fx .prog li,.iv-sec.fx .dress-dot,.iv-sec.fx .rs-stat-grid>div{opacity:0;transform:translateY(14px);transition:opacity .65s cubic-bezier(.22,1,.36,1),transform .65s cubic-bezier(.22,1,.36,1)}
.iv-sec.fx .dress-dot{transform:translateY(12px) scale(.84);transition-timing-function:cubic-bezier(.22,1.28,.36,1)}
.cd.fx.in>div,.iv-sec.fx.in .prog li,.iv-sec.fx.in .dress-dot,.iv-sec.fx.in .rs-stat-grid>div{opacity:1;transform:none}
.cd.fx.in>div:nth-child(1){transition-delay:calc(var(--d,0s) + .04s)}
.cd.fx.in>div:nth-child(2){transition-delay:calc(var(--d,0s) + .11s)}
.cd.fx.in>div:nth-child(3){transition-delay:calc(var(--d,0s) + .18s)}
.cd.fx.in>div:nth-child(4){transition-delay:calc(var(--d,0s) + .25s)}
.iv-sec.fx.in .prog li:nth-child(1),.iv-sec.fx.in .dress-dot:nth-child(1),.iv-sec.fx.in .rs-stat-grid>div:nth-child(1){transition-delay:.1s}
.iv-sec.fx.in .prog li:nth-child(2),.iv-sec.fx.in .dress-dot:nth-child(2),.iv-sec.fx.in .rs-stat-grid>div:nth-child(2){transition-delay:.19s}
.iv-sec.fx.in .prog li:nth-child(3),.iv-sec.fx.in .dress-dot:nth-child(3),.iv-sec.fx.in .rs-stat-grid>div:nth-child(3){transition-delay:.28s}
.iv-sec.fx.in .prog li:nth-child(4),.iv-sec.fx.in .dress-dot:nth-child(4){transition-delay:.37s}
.iv-sec.fx.in .prog li:nth-child(5),.iv-sec.fx.in .dress-dot:nth-child(5){transition-delay:.46s}
.iv-sec.fx.in .prog li:nth-child(6),.iv-sec.fx.in .dress-dot:nth-child(6){transition-delay:.55s}
.iv-sec.fx.in .prog li:nth-child(n+7),.iv-sec.fx.in .dress-dot:nth-child(n+7){transition-delay:.62s}

/* золотой текст имён и переливы */
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .theme-luxury .inv-names,.theme-emerald .inv-names,.theme-qazaq .inv-names,.theme-uzatu2 .inv-names{background:linear-gradient(120deg,#F8EBC6 8%,#E0C487 42%,#FFF7DF 56%,#B58F4B 100%);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:goldShimmer 5.2s linear infinite}
  .theme-jubilee .ed-big{background:linear-gradient(135deg,#876121,#DFBE76,#876121);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:goldShimmer 4.8s linear infinite}
}

.fx-cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}

/* общие декоративные анимации */
@keyframes twinkle{0%,100%{opacity:.14;transform:scale(.7) rotate(0)}50%{opacity:.95;transform:scale(1.14) rotate(18deg)}}

/* ============ № 01 LUXURY (Восьмиугольный Бриллиант + Корона + Плашка + Шахматная программа) ============ */
.theme-luxury{background:radial-gradient(70% 34% at 50% 0%,rgba(217,188,127,.22),transparent 72%),radial-gradient(130% 90% at 50% 0%,#1A2E23 0%,#0B1511 70%);color:#EFE4C6;--acc:#D9BC7F;--acc-ink:#241A08;--field:rgba(255,255,255,.07)}

.theme-qazaq .inv-inner{border:1px solid rgba(217,188,127,.45);border-radius:160px 160px 14px 14px;padding:clamp(34px,7vw,48px) clamp(16px,4.5vw,32px)}

var D=null,lang="ru",langs=["ru"],tickTimer=null,isSubmitting=false,rsvpState=null,memRsvp={};
function t(k){return S[lang][k];}
function fill(s,o){return String(s).replace(/\{(\w+)\}/g,function(_,k){return o[k]!=null?o[k]:"";});}
function addDays(str,n){var x=new Date(str+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10);}
function dDot(s){var p=s.split("-");return p[2]+"."+p[1]+"."+p[0];}
function dSpaced(s){var p=s.split("-");return p[2]+" · "+p[1]+" · "+p[0];}
function dHuman(s){var p=s.split("-");return(+p[2])+" "+S[lang].months[+p[1]-1]+" "+p[0];}
function startMs(){return new Date(D.d+"T"+D.s+":00"+TZO).getTime();}
function endDate(){return D.e<=D.s?addDays(D.d,1):D.d;}
function endMs(){return new Date(endDate()+"T"+D.e+":00"+TZO).getTime();}
function deadline(){return Math.max(endMs(),new Date(D.d+"T23:59:59"+TZO).getTime());}
function names(){return D.n||"";}
function validAtt(v){return(v==="yes"||v==="no"||v==="maybe")?v:"yes";}
function normName(s){return String(s||"").replace(/\s+/g," ").trim().slice(0,NAME_MAX);}
function capName(s){return normName(s).replace(/(^|[\s-])([a-zа-яёәғқңөұүһі])/gi,function(_,p,c){return p+c.toUpperCase();});}
function isValidNamePart(s){
  var v=normName(s);
  if(!v)return false;
  if(!/^[a-zа-яёәғқңөұүһі'’\-\s]+$/i.test(v))return false;
  var letters=v.replace(/[^a-zа-яёәғқңөұүһі]/gi,"");
  if(letters.length<2)return false;
  if(/(.)\1{2,}/i.test(letters))return false;
  if(/^(.{1,2})\1{2,}$/i.test(letters))return false;
  if(!/[аеёиоуыэюяәөүұіaeiouy]/i.test(letters))return false;
  if(/[бвгджзйклмнпрстфхцчшщғқңһbcdfghjklmnpqrstvwxz]{5,}/i.test(letters))return false;
  var low=letters.toLowerCase();
  if(/(йцук|фыва|олдж|ячсм|qwert|asdf|zxcv|абвг|abcd)/.test(low))return false;
  var bad=["тест","test","аноним","гость","имя","фамилия","никто","незнаю","лол","кек","привет","hello","admin","user","name","surname","none","null"];
  for(var i=0;i<bad.length;i++){if(low===bad[i]||(low.indexOf(bad[i])===0&&low.length<=bad[i].length+2))return false;}
  return true;
}
function makeId(){return(window.crypto&&crypto.randomUUID)?crypto.randomUUID():("rsvp-"+Date.now()+"-"+Math.random().toString(36).slice(2,10));}

function guestHint(n){n=clampGuests(n);return n<=1?t("g_one"):fill(t("g_many"),{n:n,extra:n-1});}

function syncGuestsUI(f,n){

function loadRsvpState(){

  var p=null;
  try{
    var raw=localStorage.getItem(key)||(legKey!==key?localStorage.getItem(legKey):null);
    if(raw)p=JSON.parse(raw);
  }catch(_){}
  if((!p||typeof p!=="object")&&cached&&typeof cached==="object")p=cached;
  if(!p||typeof p!=="object"){memRsvp[key]=def;return def;}
  var sAtt=validAtt(p.sentAtt);
  var sCnt=sAtt==="yes"?clampGuests(p.sentCnt||p.guests||1):0;
  var st={
    id:String(p.id||def.id).slice(0,64),
    nm:normName(p.nm),
    fm:normName(p.fm),
    att:validAtt(p.att),
    cnt:clampGuests(p.cnt||(sCnt||1)),
    sent:Boolean(p.sent&&p.sentNm&&p.sentFm),
    sentNm:normName(p.sentNm),
    sentFm:normName(p.sentFm),
    sentAtt:sAtt,
    sentCnt:sCnt,

    guests:sCnt,
    maybe:sAtt==="maybe"?1:0,
    editing:false,
    lastSentAt:Number.isFinite(+p.lastSentAt)?+p.lastSentAt:0,
    lang:(p.lang==="ru"||p.lang==="kz")?p.lang:""
  };

}

      }else if(k==="embers"){
        ctx.fillStyle="rgba(255,175,75,.85)";
        ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();
      }else if(k==="stars"){
        ctx.fillStyle="rgba(218,180,96,.85)";
        ctx.beginPath();ctx.moveTo(0,-p.r*1.6);ctx.lineTo(p.r*.45,-p.r*.45);ctx.lineTo(p.r*1.6,0);ctx.lineTo(p.r*.45,p.r*.45);ctx.lineTo(0,p.r*1.6);ctx.lineTo(-p.r*.45,p.r*.45);ctx.lineTo(-p.r*1.6,0);ctx.lineTo(-p.r*.45,-p.r*.45);ctx.closePath();ctx.fill();
      }else if(k==="geo"){
        ctx.strokeStyle="rgba(168,140,94,.45)";ctx.lineWidth=1;

        ctx.fillStyle="rgba(212,175,95,.82)";
        ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    }
    fxRaf=requestAnimationFrame(frame);
  }
  fxResume=function(){if(!fxRaf&&!document.hidden)fxRaf=requestAnimationFrame(frame);};
  fxResume();
}

var inviteStats={oid:"",rows:null,loading:false,loaded:false,refreshTimer:null};
function statsOid(){return(D&&D.oid&&D.oid!=="default")?String(D.oid):(D?("h_"+Math.abs(hash(names()+"|"+D.d+"|"+D.s))):"default");}
function statsStorageKey(){return"saqtaa-rsvp-rows-"+statsOid();}
function readLocalStatsRows(){
  try{var raw=localStorage.getItem(statsStorageKey());var arr=raw?JSON.parse(raw):[];return Array.isArray(arr)?arr:[];}catch(_){return[];}
}
function parseStatAtt(r){
  var a=String((r&&r.att)||"").toLowerCase().trim(),lbl=String((r&&r.att_label)||"").toLowerCase();
  if(a==="yes"||lbl.indexOf("прид")===0||lbl.indexOf("келед")>=0)return"yes";
  if(a==="no"||lbl.indexOf("не прид")>=0||lbl.indexOf("келмей")>=0||lbl.indexOf("алмай")>=0)return"no";
  if(a==="maybe"||lbl.indexOf("пока")>=0||lbl.indexOf("ойлан")>=0||lbl.indexOf("дума")>=0)return"maybe";
  return validAtt(a);
}
function statRowTime(r){
  if(!r||!r.time)return 0;
  var s=String(r.time).trim(),m=s.match(/^(\d{2})\.(\d{2})\.(\d{4})(?:\s+(\d{2}):(\d{2}))?/);
  if(m)return Date.UTC(+m[3],+m[2]-1,+m[1],(+(m[4]||0))-5,+(m[5]||0));
  var ms=Date.parse(s);
  return Number.isFinite(ms)?ms:0;
}
function mergeStatsRows(localRows,cloudRows){
  var map=Object.create(null),order=[];
  function upsert(r,fromCloud){
    if(!r||typeof r!=="object")return;
    var id=String(r.id||"").trim();
    if(!fromCloud&&rsvpState&&rsvpState.id&&id===rsvpState.id)return;
    var nk=(normName(r.name)+"|"+normName(r.fam)).toLowerCase();
    var k=id?("id:"+id):(nk&&nk!=="|"?"nm:"+nk:"");
    if(!k)return;
    if(!map[k]){map[k]=r;order.push(k);return;}
    var prev=map[k],pt=statRowTime(prev),nt=statRowTime(r);
    if(nt>pt||(nt===pt&&fromCloud))map[k]=r;
  }
  (cloudRows||[]).forEach(function(r){upsert(r,true);});
  (localRows||[]).forEach(function(r){upsert(r,false);});
  if(rsvpState&&rsvpState.sent&&rsvpState.id){
    var rk="id:"+rsvpState.id;
    var sCnt=rsvpState.sentAtt==="yes"?clampGuests(rsvpState.sentCnt||rsvpState.guests||1):0;
    var localCurrent={id:rsvpState.id,name:rsvpState.sentNm,fam:rsvpState.sentFm,att:rsvpState.sentAtt,guests:sCnt,time:rsvpState.lastSentAt?new Date(rsvpState.lastSentAt).toISOString():""};
    if(!map[rk]){map[rk]=localCurrent;order.push(rk);}
    else if(statRowTime(localCurrent)>=statRowTime(map[rk])){map[rk]=Object.assign({},map[rk],localCurrent);}
  }
  return order.map(function(k){return map[k];});
}
function computeStatsCounts(){
  var oid=statsOid();
  var cloud=(inviteStats.oid===oid&&Array.isArray(inviteStats.rows))?inviteStats.rows:[];
  var rows=mergeStatsRows(readLocalStatsRows(),cloud);
  var yes=0,no=0,maybe=0;
  rows.forEach(function(r){
    var att=parseStatAtt(r);
    if(att==="yes"){
      var g=parseInt(r.guests,10);
      yes+=(Number.isFinite(g)&&g>0)?g:1;
    }else if(att==="no"){
      no+=1;
    }else{
      maybe+=1;
    }
  });
  return{yes:yes,no:no,maybe:maybe,responses:rows.length};
}
function updateStatsDOM(){
  if(!D||D.rsvp===false)return;
  var box=app.querySelector(".rs-stats");
  if(!box)return;
  var c=computeStatsCounts();
  var elY=box.querySelector('[data-stat="yes"]'),elN=box.querySelector('[data-stat="no"]'),elM=box.querySelector('[data-stat="maybe"]'),elT=box.querySelector('[data-stat="tot"]');
  if(elY)elY.textContent=String(c.yes);
  if(elN)elN.textContent=String(c.no);
  if(elM)elM.textContent=String(c.maybe);
  if(elT)elT.textContent=c.responses?fill(t("st_tot"),{n:c.responses}):t("st_empty");
}
async function fetchInviteStats(force){
  if(!D||D.rsvp===false)return;
  var srv=D.srv||D.sheet;
  if(!srv)return;
  var oid=statsOid();
  if(!force&&inviteStats.oid===oid&&(inviteStats.loading||inviteStats.loaded))return;
  inviteStats.oid=oid;
  inviteStats.loading=true;
  try{
    var sep=srv.indexOf("?")>=0?"&":"?";
    var res=await fetch(srv+sep+"action=stats&oid="+encodeURIComponent(oid)+"&_t="+Date.now(),{method:"GET",cache:"no-store"});
    if(!res.ok)throw new Error("http-"+res.status);
    var json=await res.json();
    if(json&&json.ok&&Array.isArray(json.rows)&&statsOid()===oid){
      inviteStats.rows=json.rows;
      inviteStats.loaded=true;
      updateStatsDOM();
    }
  }catch(_){
  }finally{
    if(statsOid()===oid)inviteStats.loading=false;
  }
}
(function bindStatsObservers(){
  if(typeof MutationObserver!=="undefined"){
    var mo=new MutationObserver(function(muts){
      for(var i=0;i<muts.length;i++){
        var m=muts[i];
        if(m.type==="attributes"&&m.target&&m.target.classList&&m.target.classList.contains("rs-done")){
          updateStatsDOM();
          if(!m.target.hidden){
            clearTimeout(inviteStats.refreshTimer);
            inviteStats.refreshTimer=setTimeout(function(){fetchInviteStats(true);},2600);
          }
          break;
        }
      }
    });
    mo.observe(app,{attributes:true,attributeFilter:["hidden"],subtree:true});
  }
  window.addEventListener("storage",function(e){if(D&&e&&e.key===statsStorageKey())updateStatsDOM();});
})();

async function postToSheet(cleanNm,cleanFm,val,isUpdate,prevVal,rsvpId,noEmail,guestsCount){
  var srv=D.srv||D.sheet;
  if(!srv)return false;
  var emailLang=(D.l==="both")?"both":lang;
  var labelsRu={yes:"Придёт",no:"Не придёт",maybe:"Пока не знает"};
  var labelsKz={yes:"Келеді",no:"Келе алмайды",maybe:"Әзірге білмейді"};
  var labelsBoth={yes:"Келеді / Придёт",no:"Келе алмайды / Не придёт",maybe:"Әзірге білмейді / Пока не знает"};
  var label=(emailLang==="both"?labelsBoth:(emailLang==="kz"?labelsKz:labelsRu))[val]||labelsRu.yes;
  var gCount=val==="yes"?clampGuests(guestsCount):0;
  var oid=D.oid||"default";

    "&oid="+encodeURIComponent(oid)+
    "&id="+encodeURIComponent(rsvpId)+
    "&name="+encodeURIComponent(cleanNm)+
    "&fam="+encodeURIComponent(cleanFm)+
    "&att_code="+encodeURIComponent(val)+
    "&att="+encodeURIComponent(label)+
    "&guests="+encodeURIComponent(gCount)+
    "&title="+encodeURIComponent(names())+
    "&date="+encodeURIComponent(dateHuman)+
    "&lang="+encodeURIComponent(emailLang)+
    (toEmail?"&to_email="+encodeURIComponent(toEmail):"")+
    (noEmail?"&no_email=1":"")+
    (isUpdate?"&isUpdate=1":"")+
    "&_t="+Date.now();
  var ctrl=typeof AbortController!=="undefined"?new AbortController():null;
  var timer=ctrl?setTimeout(function(){ctrl.abort();},12000):null;
  try{

    if(timer)clearTimeout(timer);
    return false;
  }
}

function saveLocalRsvpRow(cleanNm,cleanFm,val,rsvpId,guestsCount){

function loadLocalDevicePhoto(oid){
  return new Promise(function(resolve){
    if(!oid||!window.indexedDB){resolve("");return;}
    var settled=false;
    function fin(v){if(!settled){settled=true;resolve(v||"");}}
    setTimeout(function(){fin("");},500);
    try{
      var req=indexedDB.open("saqtaa-local-media",1);
      req.onblocked=function(){fin("");};
      req.onerror=function(){fin("");};
      req.onsuccess=function(){
        try{
          var db=req.result;
          if(!db.objectStoreNames.contains("photos")){fin("");return;}
          var tx=db.transaction("photos","readonly"),st=tx.objectStore("photos");
          var r1=st.get(oid);
          r1.onsuccess=function(){fin(r1.result&&r1.result.blob?URL.createObjectURL(r1.result.blob):"");};
          r1.onerror=function(){fin("");};
        }catch(_){fin("");}
      };
    }catch(_){fin("");}
  });
}

app.addEventListener("submit",async function(e){
  var f=e.target.closest(".rs-form");if(!f||isSubmitting)return;e.preventDefault();
  var hp=f.querySelector('input[name="botcheck"]');
  if(hp&&hp.checked)return;
  var inputs=f.querySelectorAll("input[type=text]"),nm=inputs[0],fm=inputs[1],err=f.querySelector(".rs-err");
  function bad(el,key){err.textContent=t(key);el.classList.remove("err");void el.offsetWidth;el.classList.add("err");el.focus();}
  var cleanNm=capName(nm.value),cleanFm=capName(fm.value);
  nm.value=cleanNm;fm.value=cleanFm;
  if(!cleanNm){bad(nm,"e_name");return;}
  if(!isValidNamePart(cleanNm)){bad(nm,"e_name_bad");return;}
  if(!cleanFm){bad(fm,"e_fam");return;}
  if(!isValidNamePart(cleanFm)){bad(fm,"e_fam_bad");return;}
  err.textContent="";
  var val=validAtt((f.querySelector("input[type=radio]:checked")||{value:"yes"}).value);
  var gv=f.querySelector("[data-gval]");
  var cnt=val==="yes"?clampGuests(gv?gv.textContent:(rsvpState?rsvpState.cnt:1)):0;
  var full=cleanNm+" "+cleanFm;
  var sec=f.closest(".iv-sec");

  /* Если гость нажал «Изменить ответ», но ничего не менял — не отправляем дубликат */
  if(rsvpState&&rsvpState.sent&&rsvpState.sentNm===cleanNm&&rsvpState.sentFm===cleanFm&&rsvpState.sentAtt===val&&(val!=="yes"||clampGuests(rsvpState.sentCnt||rsvpState.guests||1)===cnt)){
    rsvpState.nm=cleanNm;rsvpState.fm=cleanFm;rsvpState.att=val;if(val==="yes")rsvpState.cnt=cnt;rsvpState.sentCnt=cnt;rsvpState.guests=cnt;rsvpState.editing=false;
    saveRsvpState();
    showDoneCard(sec,full,val,true,cnt);
    return;
  }
  /* Защита от слишком частой повторной отправки (cooldown) */
  if(rsvpState&&rsvpState.lastSentAt&&(Date.now()-rsvpState.lastSentAt)<RSVP_COOLDOWN_MS){
    err.textContent=t("e_wait");
    return;
  }

  var hadSent=Boolean(rsvpState&&rsvpState.sent);
  var samePerson=hadSent&&rsvpState.sentNm.toLowerCase()===cleanNm.toLowerCase()&&rsvpState.sentFm.toLowerCase()===cleanFm.toLowerCase();
  var isUpdate=hadSent&&samePerson;
  var prevVal=rsvpState?rsvpState.sentAtt:"yes";
  var nextRev=isUpdate?((rsvpState.rev||1)+1):1;
  var rsvpId=isUpdate?(rsvpState.id||makeId()):(hadSent?makeId():((rsvpState&&rsvpState.id)?rsvpState.id:makeId()));

  var tasks=[],useEjs=Boolean(D.ejs&&D.ejs.s);
  if(D.srv||D.sheet){
    tasks.push(postToSheet(cleanNm,cleanFm,val,isUpdate,prevVal,rsvpId,useEjs,cnt));
  }
  if(useEjs){
    tasks.push(postEmailJS(full,val,isUpdate,rsvpId,cnt));
  }

  if(tasks.length){
    var sendBtn=f.querySelector(".rs-send");
    isSubmitting=true;
    if(sendBtn){sendBtn.disabled=true;sendBtn.textContent="⏳ "+t("sending");}
    var results=await Promise.all(tasks);
    isSubmitting=false;
    var curForm=app.querySelector(".rs-form")||f;
    var curBtn=curForm&&curForm.querySelector(".rs-send");
    if(curBtn){curBtn.disabled=false;curBtn.textContent="✦ "+t("send")+" ✦";}
    if(!results.every(Boolean)){
      var curErr=(curForm&&curForm.querySelector(".rs-err"))||err;
      if(curErr)curErr.textContent=t("e_send");
      return;
    }
  }

  if(!rsvpState)rsvpState=loadRsvpState();
  rsvpState.id=rsvpId;
  rsvpState.nm=cleanNm;rsvpState.fm=cleanFm;rsvpState.att=val;
  if(val==="yes")rsvpState.cnt=cnt;
  rsvpState.sent=true;rsvpState.sentNm=cleanNm;rsvpState.sentFm=cleanFm;rsvpState.sentAtt=val;rsvpState.sentCnt=cnt;
  rsvpState.rev=nextRev;rsvpState.guests=cnt;rsvpState.maybe=(val==="maybe"?1:0);
  rsvpState.editing=false;rsvpState.lastSentAt=Date.now();
  saveRsvpState();
  saveLocalRsvpRow(cleanNm,cleanFm,val,rsvpId,cnt);
  var activeSec=(app.querySelector(".rs-form")&&app.querySelector(".rs-form").closest(".iv-sec"))||sec;
  if(activeSec)showDoneCard(activeSec,full,val,true,cnt);
  updateStatsDOM();
});

    syncGuestsUI(sf,nxt);
    if(gv&&nxt!==cur){gv.classList.remove("pop");void gv.offsetWidth;gv.classList.add("pop");}
    captureFormToState();
    return;
  }
  var ed=e.target.closest(".rd-edit");
  if(ed){
    var sec=ed.closest(".iv-sec");
    if(rsvpState){
      rsvpState.editing=true;
      rsvpState.nm=rsvpState.sentNm||rsvpState.nm;
      rsvpState.fm=rsvpState.sentFm||rsvpState.fm;
      rsvpState.att=validAtt(rsvpState.sentAtt||rsvpState.att);
      rsvpState.cnt=clampGuests(rsvpState.sentCnt||rsvpState.cnt||1);
      saveRsvpState();
    }
    sec.querySelector(".rs-done").hidden=true;
    var f=sec.querySelector(".rs-form");
    var inputs=f.querySelectorAll("input[type=text]");
    if(rsvpState){
      if(inputs[0])inputs[0].value=rsvpState.nm;
      if(inputs[1])inputs[1].value=rsvpState.fm;
      var rad=f.querySelector('input[type=radio][value="'+validAtt(rsvpState.att)+'"]');
      if(rad)rad.checked=true;
      syncOpts(f);
      syncGuestsUI(f,rsvpState.cnt);
    }
    f.hidden=false;
    if(inputs[0])inputs[0].focus();
  }
});

/* ---------- служебные экраны ---------- */
function screen(h,p){document.body.style.background="#0F4A38";app.innerHTML='<div class="msg"><div><h1>'+h+'</h1>'+p+'</div></div>';}

/* ---------- запуск ---------- */
async function applyInviteData(rawD,instantPreview){
  if(tickTimer){clearInterval(tickTimer);tickTimer=null;}
  D=rawD;
  var dateText=String(D&&D.d||""),dateCheck=new Date(dateText+"T12:00:00Z");
  if(!D||typeof D!=="object"||Array.isArray(D)||!/^\d{4}-\d{2}-\d{2}$/.test(dateText)||
     !Number.isFinite(dateCheck.getTime())||dateCheck.toISOString().slice(0,10)!==dateText){
    screen("Ссылка не открылась ✦","<p>Похоже, ссылка повреждена или скопирована не полностью. Попросите отправить её ещё раз.</p><p>Сілтеме қате немесе толық көшірілмеген. Қайта жіберуді сұраңыз.</p>");return;
  }
  D.s=/^([01]?\d|2[0-3]):[0-5]\d$/.test(String(D.s||""))?String(D.s).padStart(5,"0"):"18:00";
  D.e=/^([01]?\d|2[0-3]):[0-5]\d$/.test(String(D.e||""))?String(D.e).padStart(5,"0"):"23:30";
  D.n=String(D.n||"").slice(0,120);
  D.t=TPL[D.t]?D.t:"luxury";
  D.ve=String(D.ve||"").slice(0,120);D.ad=String(D.ad||"").slice(0,160);
  D.g=safeUrl(D.g);D.p=safeUrl(D.p);D.h=String(D.h||"").slice(0,60);D.k=String(D.k||"").slice(0,80);
  if(!D.p){
    var locPh=await loadLocalDevicePhoto(D.oid);
    if(locPh)D.p=locPh;
  }
  ["ru","kz"].forEach(function(k){
    var b=D[k]&&typeof D[k]==="object"?D[k]:{};
    D[k]={ti:String(b.ti||"").slice(0,80),le:String(b.le||"").slice(0,700),sg:String(b.sg||"").slice(0,160),
      pr:Array.isArray(b.pr)?b.pr.slice(0,20).map(function(p){return Array.isArray(p)?[String(p[0]||"").slice(0,5),String(p[1]||"").slice(0,60),String(p[2]||"").slice(0,90)]:[];}).filter(function(p){return p[0]&&p[1];}):[]};
  });
  D.rsvp=D.rsvp!==false;
  if(D.dc===false){D.dc=false;}
  else if(D.dc&&typeof D.dc==="object"){
    var rawSw=Array.isArray(D.dc.sw)?D.dc.sw.slice(0,10).map(function(s){
      return Array.isArray(s)?[String(s[0]||"").slice(0,40),String(s[1]||"").slice(0,40),String(s[2]||"").slice(0,60)]:null;
    }).filter(function(s){return s&&(s[0]||s[1]||s[2]);}):null;
    D.dc={
      ru:String(D.dc.ru||"").slice(0,80),kz:String(D.dc.kz||"").slice(0,80),
      sru:String(D.dc.sru||"").slice(0,140),skz:String(D.dc.skz||"").slice(0,140),
      pal:(D.dc.pal==="none"||DC_PALS[D.dc.pal])?String(D.dc.pal):"",
      nt:D.dc.nt?1:0,
      ns:D.dc.ns?1:0,
      sw:rawSw
    };
  }else{delete D.dc;}
  langs=D.l==="both"?["ru","kz"]:[D.l==="kz"?"kz":"ru"];
  rsvpState=loadRsvpState();
  if(!instantPreview||langs.indexOf(lang)<0){
    lang=langs[0];
    if(langs.length>1){
      if(rsvpState.lang&&langs.indexOf(rsvpState.lang)>=0)lang=rsvpState.lang;
      else if(/^kk/i.test(navigator.language||""))lang="kz";
    }
  }
  try{
    if(!instantPreview&&Date.now()>deadline()){
      screen("Приглашение больше недоступно ✦","<p>Мероприятие уже состоялось. Спасибо, что были с нами!</p><p>Мереке өтіп кетті. Бізбен бірге болғаныңызға рақмет!</p>");return;
    }
    var prevScroll=instantPreview?(window.scrollY||0):0;
    render(Boolean(instantPreview));
    if(instantPreview)window.scrollTo(0,prevScroll);
    tickTimer=setInterval(tick,1000);
    if(!instantPreview&&D.rsvp&&(D.srv||D.sheet)){
      var warmUrl=D.srv||D.sheet;
      setTimeout(function(){
        try{fetch(warmUrl+(warmUrl.indexOf("?")===-1?"?":"&")+"action=ping&_t="+Date.now(),{method:"GET"}).catch(function(){});}catch(_){}
      },700);
    }
  }catch(e){
    console.error("SAQTAA_INIT_ERR",e);
    screen("Ошибка загрузки ✦","<p>Не удалось отобразить приглашение: "+esc(e&&e.message?e.message:String(e))+"</p><p>Шақыруды ашу мүмкін болмады.</p>");
  }
}
async function init(){
  var decoded=null;
  try{decoded=await decode(location.hash);}catch(_){decoded=null;}
  await applyInviteData(decoded,false);
}
addEventListener("hashchange",function(){init();});
addEventListener("message",function(e){
  if(e&&e.data&&e.data.type==="saqtaa-preview"&&e.data.payload){
    applyInviteData(e.data.payload,true);
  }
});
init();
})();
</script>
