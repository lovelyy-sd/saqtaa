<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Приглашение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Oswald:wght@400;500;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root, body.tpl-03 { --bg:#7d2b3a; --text:#f6e7d7; --muted:#d9aab4; --accent:#dcaf7f; --line:rgba(220,175,130,.55); --input-bg:rgba(255,255,255,.08); --input-border:rgba(220,175,130,.45); --input-text:#f6e7d7; --font-serif:'Playfair Display','Cormorant Garamond',Georgia,serif; --font-sans:'Montserrat',Arial,sans-serif; }
  body.tpl-01 { --bg:#101014; --text:#f3ead7; --muted:rgba(243,234,215,.66); --accent:#d4af37; --line:rgba(212,175,55,.5); --input-bg:rgba(255,255,255,.06); --input-border:rgba(212,175,55,.4); --input-text:#f3ead7; }
  body.tpl-02 { --bg:#fdf6f0; --text:#4b3a3f; --muted:#8a7076; --accent:#c9648a; --line:rgba(201,100,138,.45); --input-bg:#fff; --input-border:#ead7d9; --input-text:#4b3a3f; }
  body.tpl-04 { --bg:#f2f0eb; --text:#141414; --muted:#5c5c5c; --accent:#141414; --line:rgba(20,20,20,.4); --input-bg:#fff; --input-border:#141414; --input-text:#141414; --font-serif:'Oswald',sans-serif; }
  body.tpl-05 { --bg:#07271b; --text:#eae4d3; --muted:rgba(234,228,211,.7); --accent:#d9b45b; --line:rgba(217,180,91,.5); --input-bg:rgba(255,255,255,.07); --input-border:rgba(217,180,91,.4); --input-text:#eae4d3; }
  body.tpl-06 { --bg:#fff6ec; --text:#4a3f38; --muted:#8b7d72; --accent:#2fb8a6; --line:rgba(47,184,166,.45); --input-bg:#fff; --input-border:#ffe1c9; --input-text:#4a3f38; --font-serif:'Caveat',cursive; }

  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-sans); line-height:1.6; min-height:100vh; }
  .invite { max-width:660px; margin:0 auto; padding:52px 20px 70px; text-align:center; }
  .photo { display:block; max-width:340px; width:100%; margin:0 auto 30px; border:1px solid var(--line); border-radius:12px; object-fit:cover; }
  .ornament-row,.divider { display:flex; align-items:center; gap:16px; color:var(--accent); }
  .ornament-row .line,.divider .line { flex:1; height:1px; background:var(--line); }
  .ornament-row svg { width:30px; height:26px; flex:none; }
  .divider { margin:30px auto; max-width:420px; }
  .divider .orn { font-size:16px; line-height:1; }
  .eyebrow { margin-top:26px; font-size:12px; letter-spacing:.3em; text-transform:uppercase; opacity:.85; }
  .names { font-family:var(--font-serif); font-size:54px; font-weight:700; line-height:1.15; margin:16px 0 12px; overflow-wrap:break-word; }
  body.tpl-04 .names { text-transform:uppercase; letter-spacing:.05em; font-size:46px; }
  body.tpl-06 .names { font-size:60px; }
  .subtitle { font-size:14px; letter-spacing:.32em; text-transform:uppercase; margin-bottom:26px; }
  .invite-text { max-width:560px; margin:0 auto; font-size:17px; font-weight:300; line-height:1.8; white-space:pre-line; overflow-wrap:break-word; }
  .signature { margin-top:16px; font-family:var(--font-serif); font-style:italic; font-size:18px; color:var(--accent); }
  .lang-label { display:inline-block; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .date-line { font-family:var(--font-serif); font-size:23px; font-weight:700; letter-spacing:.14em; }
  .countdown { display:flex; justify-content:center; gap:12px; margin:26px 0 6px; flex-wrap:wrap; }
  .cd-box { min-width:88px; padding:14px 10px 12px; border:1px solid var(--line); border-radius:10px; }
  .cd-num { font-family:var(--font-serif); font-size:26px; font-weight:700; }
  .cd-label { margin-top:6px; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
  .cd-done { margin:20px 0; color:var(--accent); letter-spacing:.12em; }
  .sec-head { margin:40px 0 20px; font-size:13px; font-weight:600; letter-spacing:.26em; text-transform:uppercase; color:var(--accent); }
  .program-list { max-width:520px; margin:0 auto; text-align:left; }
  .program-item { display:grid; grid-template-columns:62px 26px 1fr; gap:0 12px; padding:13px 0; }
  .p-time { font-family:var(--font-serif); font-size:18px; font-weight:700; color:var(--accent); text-align:right; padding-top:2px; }
  .p-marker { position:relative; }
  .p-marker::before { content:''; position:absolute; left:50%; top:7px; width:9px; height:9px; border:1.5px solid var(--accent); border-radius:50%; transform:translateX(-50%); background:var(--bg); }
  .p-marker::after { content:''; position:absolute; left:50%; top:22px; bottom:-16px; border-left:1px dashed var(--line); transform:translateX(-50%); }
  .program-item:last-child .p-marker::after { display:none; }
  .p-title { font-weight:700; font-size:16px; }
  .p-desc { margin-top:4px; font-size:14px; font-weight:300; color:var(--muted); white-space:pre-line; }
  .p-lang + .p-lang { margin-top:12px; }
  .venue-name { font-size:21px; font-weight:700; margin-bottom:6px; }
  .venue-address { font-weight:300; color:var(--muted); overflow-wrap:break-word; }
  .actions { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:20px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:12px 22px; background:transparent; border:1px solid var(--accent); border-radius:8px; color:var(--accent); font-family:var(--font-sans); font-size:13px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; text-decoration:none; cursor:pointer; transition:all .2s ease; }
  .btn:hover { background:var(--accent); color:var(--bg); }
  .rsvp-form { max-width:430px; margin:0 auto; text-align:left; }
  .form-group { margin-bottom:14px; }
  .form-group label { display:block; margin-bottom:6px; font-size:13px; color:var(--muted); }
  .form-group input,.form-group select,.form-group textarea { width:100%; min-height:48px; padding:12px 14px; background:var(--input-bg); border:1px solid var(--input-border); border-radius:8px; color:var(--input-text); font:inherit; font-size:14px; }
  .form-group textarea { min-height:100px; resize:vertical; }
  .form-note { margin-top:12px; font-size:14px; color:var(--muted); }
  .success { color:#7fe3a5; font-weight:600; }
  .error { color:#ff9d9d; font-weight:600; }
  .hashtag { margin-top:44px; font-size:14px; letter-spacing:.1em; color:var(--muted); overflow-wrap:break-word; }
  .message-screen { min-height:80vh; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; }
  .message-box h1 { font-family:var(--font-serif); font-size:36px; margin-bottom:12px; }
  .message-box p { color:var(--muted); font-weight:300; }
  @media (max-width:560px){ .invite{padding:40px 16px 56px;} .names{font-size:38px;} body.tpl-06 .names{font-size:44px;} .cd-box{min-width:74px;} .program-item{grid-template-columns:52px 22px 1fr; gap:0 8px;} .p-time{font-size:16px;} .actions .btn{width:100%;} }
</style>
</head>
<body>
<main id="app"></main>
<script>
  const EXPIRY_ENABLED = true; // поведение Claude: после конца дня мероприятия ссылка закрывается. Поставь false, чтобы отключить.

  const EVENT_TYPES = { '01':'Свадьба','02':'Свадьба','03':'Семейный той','04':'Юбилей','05':'День рождения','06':'Тұсау кесер' };

  const SAMPLE = {
    template:'03', language:'ru', names:'Мадина & Диас', bigNumber:'',
    date:'2026-11-29', startTime:'17:00', endTime:'23:00',
    venueName:'Ресторан «Астана»', address:'г. Астана, ул. Пример, 1', mapUrl:'',
    textRu:'Дорогие родные и друзья! Приглашаем вас на семейный той — праздник встречи двух семей. Будем рады разделить этот день за одним дастарханом!',
    signatureRu:'', textKz:'', signatureKz:'', hashtag:'',
    program:[
      { time:'17:00', titleRu:'Қонақ күту', descRu:'Встреча гостей и шашу', titleKz:'', descKz:'' },
      { time:'18:00', titleRu:'Той басталу', descRu:'Торжественное открытие', titleKz:'', descKz:'' },
      { time:'19:00', titleRu:'Дастархан', descRu:'Национальные блюда и бата', titleKz:'', descKz:'' },
      { time:'21:00', titleRu:'Беташар', descRu:'Обряд открывания лица невесты', titleKz:'', descKz:'' }
    ],
    photoUrl:'', web3formsKey:''
  };

  let countdownTimer = null;

  window.addEventListener('DOMContentLoaded', () => {
    let invite = null;
    if (location.hash === '#demo') invite = SAMPLE;
    else if (location.hash.startsWith('#demo-')) invite = Object.assign({}, SAMPLE, { template: location.hash.slice(6) });
    else if (location.hash.startsWith('#d=')) invite = decodePayload(location.hash.slice(3));

    if (!invite) { message('Приглашение', 'Эта страница откроет электронное приглашение по ссылке, которую создаст администратор.'); return; }

    document.body.className = 'tpl-' + String(invite.template || '03');

    if (EXPIRY_ENABLED && invite.date && Date.now() > dayEndUTC(invite.date)) { expired(invite); return; }

    renderInvite(invite);
  });

  function decodePayload(s){ try { s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length%4) s+='='; return JSON.parse(decodeURIComponent(atob(s))); } catch(e){ return null; } }
  function dayEndUTC(d){ const [y,m,dd] = d.split('-').map(Number); return Date.UTC(y, m-1, dd, 23, 59, 59) - 5*3600000; }

  function message(title, text){
    document.getElementById('app').innerHTML = '<div class="message-screen"><div class="message-box"><h1 id="m-t"></h1><p id="m-p"></p></div></div>';
    document.getElementById('m-t').textContent = title;
    document.getElementById('m-p').textContent = text;
  }
  function expired(invite){ message('Мероприятие завершилось', 'Приглашение ' + (invite.names||'') + ' больше не активно. Спасибо, что были с нами!'); }

  function renderInvite(invite){
    const app = document.getElementById('app');
    const p = invite.date ? invite.date.split('-') : [];
    const dd = p[2]||'', mm = p[1]||'', yyyy = p[0]||'';
    document.title = (invite.names||'Приглашение') + ' — Приглашение';

    app.innerHTML = `
      <div class="invite">
        <img id="invite-photo" class="photo" alt="" hidden referrerpolicy="no-referrer">
        <div class="ornament-row"><span class="line"></span>
          <svg viewBox="0 0 24 22" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 20 C 5 14, 1 9.5, 1 6 C 1 3, 3.4 1.2, 6 1.2 C 8.6 1.2, 10.6 2.8, 12 5.2 C 13.4 2.8, 15.4 1.2, 18 1.2 C 20.6 1.2, 23 3, 23 6 C 23 9.5, 19 14, 12 20 Z"/></svg>
          <span class="line"></span></div>
        <div id="eyebrow" class="eyebrow"></div>
        <h1 id="invite-names" class="names"></h1>
        <div id="invite-subtitle" class="subtitle"></div>
        <div id="text-ru-block" hidden><div id="text-ru-label" class="lang-label" hidden>Русский</div><div id="text-ru" class="invite-text"></div><div id="signature-ru" class="signature" hidden></div></div>
        <div id="text-kz-block" hidden><div class="divider" id="kz-divider" hidden><span class="line"></span><span class="orn">❧</span><span class="line"></span></div><div id="text-kz-label" class="lang-label" hidden>Қазақша</div><div id="text-kz" class="invite-text"></div><div id="signature-kz" class="signature" hidden></div></div>
        <div class="divider"><span class="line"></span><span class="orn">❧</span><span class="line"></span></div>
        <div id="invite-date" class="date-line"></div>
        <div id="countdown" class="countdown" hidden>
          <div class="cd-box"><div class="cd-num" id="cd-d">00</div><div class="cd-label">дней</div></div>
          <div class="cd-box"><div class="cd-num" id="cd-h">00</div><div class="cd-label">часов</div></div>
          <div class="cd-box"><div class="cd-num" id="cd-m">00</div><div class="cd-label">минут</div></div>
          <div class="cd-box"><div class="cd-num" id="cd-s">00</div><div class="cd-label">секунд</div></div>
        </div>
        <div id="program-section" hidden><div class="sec-head">✦&nbsp;&nbsp;Программа дня&nbsp;&nbsp;✦</div><div id="program-list" class="program-list"></div></div>
        <div id="venue-section" hidden><div class="sec-head">✦&nbsp;&nbsp;Место проведения&nbsp;&nbsp;✦</div><div id="venue-name" class="venue-name"></div><div id="venue-address" class="venue-address"></div><div class="actions"><a id="map-button" class="btn" target="_blank" rel="noopener noreferrer" hidden>Как добраться</a></div></div>
        <div id="rsvp-section" hidden><div class="sec-head">✦&nbsp;&nbsp;Подтвердите присутствие&nbsp;&nbsp;✦</div>
          <form id="rsvp-form" class="rsvp-form">
            <div class="form-group"><label for="rsvp-name">Имя и фамилия</label><input type="text" id="rsvp-name" name="name" required></div>
            <div class="form-group"><label for="rsvp-attendance">Придёте ли вы?</label><select id="rsvp-attendance" name="attendance" required><option value="">Выберите ответ</option><option value="Приду">Приду</option><option value="Приду с парой / семьёй">Приду с парой / семьёй</option><option value="Не смогу">Не смогу</option></select></div>
            <div class="form-group"><label for="rsvp-guests">Количество гостей</label><input type="number" id="rsvp-guests" name="guests" min="1" max="20" value="1"></div>
            <div class="form-group"><label for="rsvp-comment">Комментарий</label><textarea id="rsvp-comment" name="comment"></textarea></div>
            <input type="text" name="botcheck" id="rsvp-botcheck" style="display:none !important" tabindex="-1" autocomplete="off">
            <div class="actions"><button type="submit" class="btn" id="rsvp-submit">Отправить ответ</button></div>
            <div id="rsvp-status" class="form-note"></div>
          </form>
        </div>
        <div id="calendar-section" hidden><div class="sec-head">✦&nbsp;&nbsp;Календарь&nbsp;&nbsp;✦</div><div class="actions"><button type="button" class="btn" id="ics-button">Добавить в календарь</button></div></div>
        <div id="invite-hashtag" class="hashtag" hidden></div>
      </div>`;

    cover(invite, dd, mm, yyyy);
    texts(invite);
    dateLine(invite, dd, mm, yyyy);
    countdown(invite);
    program(invite);
    venue(invite);
    rsvp(invite);
    calendar(invite);
  }

  function setText(el, v){ if(!el) return; el.textContent = v||''; if(!v) el.hidden = true; }
  function rep(t, n){ return String(t||'').replaceAll('{names}', n||''); }
  function okUrl(v){ try { return ['https:','http:'].includes(new URL(v).protocol); } catch(e){ return false; } }

  function cover(invite, dd, mm, yyyy){
    const photo = document.getElementById('invite-photo');
    if (invite.photoUrl && okUrl(invite.photoUrl)) { photo.src = invite.photoUrl; photo.hidden = false; photo.addEventListener('error', ()=>{ photo.hidden = true; }); }
    setText(document.getElementById('eyebrow'), invite.date ? 'Приглашение · '+dd+'.'+mm+'.'+yyyy : 'Приглашение');
    setText(document.getElementById('invite-names'), invite.names || 'Приглашение');
    setText(document.getElementById('invite-subtitle'), invite.subtitle || EVENT_TYPES[String(invite.template||'03')] || '');
    setText(document.getElementById('invite-hashtag'), invite.hashtag || '');
  }

  function texts(invite){
    const ru = invite.language==='ru'||invite.language==='both', kz = invite.language==='kz'||invite.language==='both';
    const ruT = rep(invite.textRu, invite.names), ruS = rep(invite.signatureRu, invite.names);
    const kzT = rep(invite.textKz, invite.names), kzS = rep(invite.signatureKz, invite.names);
    if (ru && ruT) {
      document.getElementById('text-ru-block').hidden = false;
      document.getElementById('text-ru-label').hidden = invite.language!=='both';
      setText(document.getElementById('text-ru'), ruT);
      setText(document.getElementById('signature-ru'), ruS);
    }
    if (kz && kzT) {
      document.getElementById('text-kz-block').hidden = false;
      document.getElementById('kz-divider').hidden = !(ru && ruT);
      document.getElementById('text-kz-label').hidden = invite.language!=='both';
      setText(document.getElementById('text-kz'), kzT);
      setText(document.getElementById('signature-kz'), kzS);
    }
  }

  function dateLine(invite, dd, mm, yyyy){
    const el = document.getElementById('invite-date');
    if (!invite.date) { el.hidden = true; return; }
    el.textContent = [dd, mm, yyyy, invite.startTime].filter(Boolean).join(' · ');
  }

  function countdown(invite){
    if (countdownTimer) clearInterval(countdownTimer);
    const wrap = document.getElementById('countdown');
    if (!invite.date || !invite.startTime) { wrap.hidden = true; return; }
    wrap.hidden = false;
    const target = eventUTC(invite.date, invite.startTime, 0);
    const tick = () => {
      const diff = target - Date.now();
      if (diff <= 0) { clearInterval(countdownTimer); wrap.outerHTML = '<div class="cd-done">✦&nbsp;&nbsp;Мероприятие началось&nbsp;&nbsp;✦</div>'; return; }
      set('cd-d', Math.floor(diff/86400000)); set('cd-h', Math.floor(diff/3600000)%24);
      set('cd-m', Math.floor(diff/60000)%60); set('cd-s', Math.floor(diff/1000)%60);
    };
    tick(); countdownTimer = setInterval(tick, 1000);
  }
  function set(id, v){ const el = document.getElementById(id); if (el) el.textContent = String(v).padStart(2,'0'); }

  function program(invite){
    const sec = document.getElementById('program-section'), list = document.getElementById('program-list');
    const pr = Array.isArray(invite.program) ? invite.program : [];
    const ru = invite.language==='ru'||invite.language==='both', kz = invite.language==='kz'||invite.language==='both';
    list.innerHTML = '';
    pr.forEach(it => {
      const hasRu = ru && (it.titleRu||it.descRu), hasKz = kz && (it.titleKz||it.descKz);
      if (!hasRu && !hasKz && !it.time) return;
      const row = document.createElement('div'); row.className = 'program-item';
      const t = document.createElement('div'); t.className = 'p-time'; t.textContent = it.time||''; row.appendChild(t);
      const mk = document.createElement('div'); mk.className = 'p-marker'; row.appendChild(mk);
      const c = document.createElement('div');
      if (hasRu) c.appendChild(langBlock(invite.language==='both'?'Русский':'', it.titleRu, it.descRu));
      if (hasKz) c.appendChild(langBlock(invite.language==='both'?'Қазақша':'', it.titleKz, it.descKz));
      row.appendChild(c); list.appendChild(row);
    });
    sec.hidden = !list.children.length;
  }
  function langBlock(label, title, desc){
    const b = document.createElement('div'); b.className = 'p-lang';
    if (label) { const l = document.createElement('div'); l.className = 'lang-label'; l.textContent = label; b.appendChild(l); }
    if (title) { const t = document.createElement('div'); t.className = 'p-title'; t.textContent = title; b.appendChild(t); }
    if (desc) { const d = document.createElement('div'); d.className = 'p-desc'; d.textContent = desc; b.appendChild(d); }
    return b;
  }

  function venue(invite){
    const sec = document.getElementById('venue-section');
    if (!(invite.venueName||invite.address||invite.mapUrl)) { sec.hidden = true; return; }
    sec.hidden = false;
    setText(document.getElementById('venue-name'), invite.venueName||'');
    setText(document.getElementById('venue-address'), invite.address||'');
    const btn = document.getElementById('map-button');
    let href = '';
    if (invite.mapUrl && okUrl(invite.mapUrl)) href = invite.mapUrl;
    else { const q = [invite.venueName, invite.address].filter(Boolean).join(', '); if (q) href = 'https://2gis.kz/search/' + encodeURIComponent(q); }
    if (href) { btn.href = href; btn.hidden = false; }
  }

  function rsvp(invite){
    const sec = document.getElementById('rsvp-section');
    if (!invite.web3formsKey) { sec.hidden = true; return; }
    sec.hidden = false;
    document.getElementById('rsvp-form').addEventListener('submit', async e => {
      e.preventDefault();
      if (document.getElementById('rsvp-botcheck').value) { status('Ответ отправлен. Спасибо!', true); e.target.reset(); return; }
      const btn = document.getElementById('rsvp-submit'); btn.disabled = true; status('Отправляем...', false);
      const fd = new FormData(e.target);
      fd.append('access_key', invite.web3formsKey);
      fd.append('subject', 'Ответ на приглашение: ' + (invite.names||''));
      fd.append('from_name', 'SAQTAA Invite');
      fd.append('Ссылка', location.href);
      try {
        const r = await fetch('https://api.web3forms.com/submit', { method:'POST', body:fd });
        const j = await r.json();
        if (j.success) { e.target.reset(); status('Ответ отправлен. Спасибо!', true); } else status('Не удалось отправить. Попробуйте позже.', false);
      } catch(err){ status('Ошибка отправки. Проверьте интернет.', false); }
      finally { btn.disabled = false; }
    });
  }
  function status(t, ok){ const el = document.getElementById('rsvp-status'); el.textContent = t; el.className = 'form-note ' + (ok?'success':'error'); }

  function calendar(invite){
    const sec = document.getElementById('calendar-section');
    if (!invite.date || !invite.startTime) { sec.hidden = true; return; }
    sec.hidden = false;
    document.getElementById('ics-button').addEventListener('click', () => ics(invite));
  }
  function eventUTC(d, t, add){ const [y,m,dd] = d.split('-').map(Number); const [h,mi] = t.split(':').map(Number); return Date.UTC(y, m-1, dd+add, h, mi, 0) - 5*3600000; }
  function ics(invite){
    const s = eventUTC(invite.date, invite.startTime, 0);
    const add = invite.endTime && invite.endTime <= invite.startTime ? 1 : 0;
    const e = invite.endTime ? eventUTC(invite.date, invite.endTime, add) : s + 7200000;
    const f = ms => new Date(ms).toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
    const esc = t => String(t||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n').trim();
    const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SAQTAA//Invite//RU','BEGIN:VEVENT','UID:'+Date.now()+'@saqtaa','DTSTAMP:'+f(Date.now()),'DTSTART:'+f(s),'DTEND:'+f(e),'SUMMARY:'+esc(invite.names||'Приглашение'),'LOCATION:'+esc([invite.venueName,invite.address].filter(Boolean).join(', ')),'DESCRIPTION:'+esc(rep(invite.textRu, invite.names)),'END:VEVENT','END:VCALENDAR'];
    const blob = new Blob([lines.join('\r\n')], { type:'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'invitation.ics';
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }
</script>
